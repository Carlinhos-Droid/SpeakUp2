<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak Up — plataforma de comunicação escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SPEAK UP — FOLHA DE ESTILO (tema claro corporativo)
   1. TOKENS   2. BASE   3. LAYOUT   4. COMPONENTES
   5. TELAS    6. MASCOTE  7. ANIMAÇÕES  8. RESPONSIVO
   ============================================================ */

/* ---------- 1. TOKENS ---------- */
:root{
  --bg:#f3f5f8;
  --bg-deep:#eaedf2;
  --surface:#ffffff;
  --surface-2:#f6f7fa;
  --surface-3:#eef0f4;
  --line:#dde1e8;
  --line-soft:#e6e9ef;
  --txt:#1c2230;
  --txt-mid:#525a6b;
  --txt-dim:#8890a0;

  --rose:#3059c9;        /* cor primária da marca */
  --rose-deep:#24449e;
  --rose-ink:#1b3480;
  --green:#1f9d68;
  --blue:#2f80d6;
  --purple:#6552c8;
  --yellow:#b8860a;
  --orange:#c76a1f;
  --red:#c93b47;

  --easy:var(--green);
  --mid:var(--yellow);
  --hard:var(--red);

  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:22px;
  --sh:0 8px 24px rgba(28,34,48,.08);
  --sh-s:0 2px 10px rgba(28,34,48,.06);
  --sans:'Inter','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --disp:'Inter','Nunito',system-ui,sans-serif;
  --nav-w:250px;
}

/* tema escuro: mesmos nomes de variável, valores diferentes */
html[data-theme="dark"]{
  --bg:#12101a; --bg-deep:#0c0a12;
  --surface:#1b1826; --surface-2:#231f31; --surface-3:#2c2740;
  --line:#332d47; --line-soft:#2a2539;
  --txt:#f6f1f4; --txt-mid:#c3b8c9; --txt-dim:#8e8398;
  --rose:#7fa3ff; --rose-deep:#5c86f2; --rose-ink:#3f68d6;
  --green:#4ee39b; --blue:#5cb2ff; --purple:#b183ff; --yellow:#ffd25e; --orange:#ff9a5a; --red:#ff6b7a;
  --sh:0 10px 30px rgba(0,0,0,.4); --sh-s:0 4px 14px rgba(0,0,0,.3);
}
html[data-theme="dark"] .topbar{background:rgba(18,16,26,.88)}
html[data-theme="dark"] .mobile-nav{background:rgba(12,10,18,.96)}
html[data-theme="dark"] .sidebar{background:linear-gradient(180deg,var(--bg-deep),#14111d)}
html[data-theme="dark"] .xp-float{text-shadow:0 3px 12px rgba(0,0,0,.6)}

/* alto contraste: preto/branco puro, sem transparências */
html.contrast-high{
  --bg:#fff; --bg-deep:#fff; --surface:#fff; --surface-2:#fff; --surface-3:#eee;
  --line:#000; --line-soft:#000; --txt:#000; --txt-mid:#000; --txt-dim:#111;
  --rose:#0033b3; --rose-deep:#00227a; --green:#005a20; --blue:#00337a; --purple:#3d0099; --yellow:#7a5c00; --orange:#7a3900; --red:#8a0000;
}
html.contrast-high[data-theme="dark"]{
  --bg:#000; --bg-deep:#000; --surface:#000; --surface-2:#000; --surface-3:#161616;
  --line:#fff; --line-soft:#fff; --txt:#fff; --txt-mid:#fff; --txt-dim:#ddd;
  --rose:#8fb4ff; --green:#7dffbd; --blue:#9cd2ff; --purple:#d5b8ff; --yellow:#ffe38a; --orange:#ffb37a; --red:#ff98a2;
}
html.contrast-high .card, html.contrast-high .btn, html.contrast-high .input, html.contrast-high .chip,
html.contrast-high .stat-card, html.contrast-high .act-card, html.contrast-high .ach, html.contrast-high .evt,
html.contrast-high .entry, html.contrast-high .jcard, html.contrast-high .ctx-btn, html.contrast-high .mood-btn,
html.contrast-high .play-card, html.contrast-high .streak-day, html.contrast-high .tab{border-width:2px !important}
html.contrast-high .chip{background:transparent !important;border:1.5px solid currentColor}

/* movimento reduzido (controlado manualmente, além da media query do sistema) */
html.no-motion *{animation:none !important;transition:none !important}

/* utilitários de acessibilidade */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{
  position:absolute;left:12px;top:-60px;z-index:200;background:var(--rose);color:#fff;
  padding:10px 16px;border-radius:10px;font-weight:700;font-size:.88rem;transition:top .18s;
}
.skip-link:focus{top:12px}

/* botão flutuante de acessibilidade */
.a11y-fab{
  position:fixed;left:18px;bottom:18px;z-index:90;width:52px;height:52px;border-radius:50%;
  background:var(--rose);color:#fff;font-size:1.3rem;display:grid;place-items:center;
  box-shadow:var(--sh);border:none;
}
.a11y-fab:hover{filter:brightness(1.08)}
.a11y-panel{
  position:fixed;left:18px;bottom:78px;z-index:91;width:290px;max-height:70vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh);padding:16px;display:none;
}
.a11y-panel.open{display:block;animation:pop .2s ease both}
.a11y-panel h3{font-size:.98rem;margin-bottom:10px}
.a11y-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.a11y-row:last-child{border-bottom:none}
.a11y-row span{font-size:.86rem;font-weight:600;color:var(--txt-mid)}
.a11y-seg{display:flex;gap:4px;background:var(--surface-2);border-radius:9px;padding:3px}
.a11y-seg button{padding:5px 9px;border-radius:7px;font-size:.8rem;font-weight:700;color:var(--txt-mid)}
.a11y-seg button.active{background:var(--rose);color:#fff}
.a11y-switch{width:42px;height:24px;border-radius:999px;background:var(--surface-3);position:relative;border:1px solid var(--line)}
.a11y-switch span{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--txt-dim);transition:transform .15s}
.a11y-switch.on{background:var(--rose)}
.a11y-switch.on span{transform:translateX(18px);background:#fff}
.a11y-fontbtns{display:flex;gap:4px}
.a11y-fontbtns button{width:30px;height:30px;border-radius:8px;background:var(--surface-2);font-weight:800;border:1px solid var(--line-soft)}
.a11y-readbtn{width:100%;margin-top:6px}
.speak-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line-soft);font-size:.8rem;font-weight:700;color:var(--txt-mid)}
.speak-btn:hover{color:var(--rose);border-color:var(--rose)}
.speak-btn.speaking{color:var(--rose);border-color:var(--rose)}

/* ---------- 2. BASE ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--sans);
  font-size:15.5px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--disp);margin:0;line-height:1.2;letter-spacing:.1px;font-weight:700}
h1{font-size:1.8rem;font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--rose)}
::selection{background:var(--rose);color:#fff}
:focus-visible{outline:2.5px solid var(--rose);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 3. LAYOUT ---------- */
.shell{display:flex;min-height:100vh}

.sidebar{
  width:var(--nav-w);flex:0 0 var(--nav-w);
  background:#ffffff;
  border-right:1px solid var(--line-soft);
  padding:18px 14px 24px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;overflow-y:auto;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--line-soft);margin-bottom:8px}
.brand .logo{width:38px;height:38px;flex:0 0 38px}
.brand b{font-family:var(--disp);font-size:1.15rem;font-weight:800;letter-spacing:.2px;display:block;line-height:1;color:var(--txt)}
.brand small{color:var(--txt-dim);font-size:.7rem;display:block;margin-top:2px}
.nav-label{font-size:.68rem;color:var(--txt-dim);padding:12px 12px 6px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 12px;border-radius:10px;color:var(--txt-mid);font-weight:600;
  transition:background .15s,color .15s;
}
.nav-item i{font-style:normal;width:22px;text-align:center;font-size:1rem}
.nav-item:hover{background:var(--surface-2);color:var(--txt)}
.nav-item.active{background:rgba(48,89,201,.09);color:var(--rose);box-shadow:inset 3px 0 0 var(--rose)}
.nav-spacer{flex:1}
.nav-foot{font-size:.7rem;color:var(--txt-dim);padding:10px 12px;border-top:1px solid var(--line-soft)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:35;display:flex;align-items:center;gap:10px;
  padding:12px 22px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.burger{display:none;font-size:1.3rem;padding:4px 8px;border-radius:8px;background:var(--surface-2);color:var(--txt)}
.topbar .spacer{flex:1}
.stat-pill{
  display:flex;align-items:center;gap:7px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:999px;padding:6px 13px;
  font-weight:700;font-size:.87rem;white-space:nowrap;color:var(--txt-mid);
}
.stat-pill i{font-style:normal}
.stat-pill.fire{color:var(--orange)}
.stat-pill.xp{color:var(--yellow)}
.stat-pill.lvl{color:var(--purple)}
.avatar-btn{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:1.1rem;border:1.5px solid var(--line)}
.avatar-btn:hover{border-color:var(--rose)}

.view{padding:26px 26px 110px;max-width:1180px;width:100%;margin:0 auto;animation:viewIn .28s ease both}
.view-head{margin-bottom:20px}
.view-head p{color:var(--txt-mid);margin-top:6px;max-width:64ch}

/* ---------- 4. COMPONENTES ---------- */
.card{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-l);
  padding:20px;box-shadow:var(--sh-s);
}
.card.soft{background:var(--surface-2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--txt-dim)}
.mid{color:var(--txt-mid)}
.sec-title{display:flex;align-items:center;gap:9px;margin:30px 0 14px}
.sec-title h2{font-size:1.08rem}
.sec-title .muted{font-size:.83rem;font-weight:600}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 17px;border-radius:10px;font-weight:700;font-size:.9rem;
  background:var(--surface-3);color:var(--txt);
  border:1px solid var(--line);
  transition:filter .15s,background .15s,border-color .15s;
}
.btn:hover{filter:brightness(.98);border-color:var(--txt-dim)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--rose);color:#fff;border-color:var(--rose-deep)}
.btn.primary:hover{background:var(--rose-deep)}
.btn.green{background:var(--green);color:#fff;border-color:#187d52}
.btn.blue{background:var(--blue);color:#fff;border-color:#2568ad}
.btn.purple{background:var(--purple);color:#fff;border-color:#4f3fa8}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--txt-mid)}
.btn.ghost:hover{color:var(--txt);border-color:var(--rose)}
.btn.sm{padding:7px 12px;font-size:.82rem;border-radius:9px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:var(--surface-3);font-size:.75rem;font-weight:700;color:var(--txt-mid);
}
.chip.easy{background:rgba(31,157,104,.10);color:var(--easy)}
.chip.mid{background:rgba(184,134,10,.10);color:var(--mid)}
.chip.hard{background:rgba(201,59,71,.10);color:var(--hard)}
.chip.xp{background:rgba(184,134,10,.10);color:var(--yellow)}
.chip.skill{background:rgba(47,128,214,.10);color:var(--blue)}
.chip.ctx{background:rgba(101,82,200,.10);color:var(--purple)}

.bar{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:999px;background:var(--rose);transition:width .6s cubic-bezier(.2,.8,.3,1)}
.bar.green > span{background:var(--green)}
.bar.blue > span{background:var(--blue)}
.bar.yellow > span{background:var(--yellow)}
.bar.thin{height:6px}

.stat-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:16px;display:flex;gap:13px;align-items:center}
.stat-card .ico{width:42px;height:42px;flex:0 0 42px;border-radius:10px;display:grid;place-items:center;font-size:1.15rem;background:var(--surface-2)}
.stat-card b{font-family:var(--disp);font-size:1.4rem;display:block;line-height:1.1;color:var(--txt)}
.stat-card small{color:var(--txt-dim);font-size:.76rem;font-weight:700}

.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:700;font-size:.85rem;margin-bottom:6px;color:var(--txt-mid)}
.input,textarea.input,select.input{
  width:100%;background:var(--surface);border:1.5px solid var(--line);
  border-radius:10px;padding:10px 13px;color:var(--txt);transition:border-color .15s;
}
.input:focus{border-color:var(--rose);outline:none}
textarea.input{resize:vertical;min-height:84px;line-height:1.55}

.empty{text-align:center;padding:34px 18px;color:var(--txt-dim)}
.empty .mascot{margin:0 auto 12px}

.table-wrap{overflow-x:auto;border-radius:var(--r-m);border:1px solid var(--line-soft)}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{padding:12px 14px;text-align:left;font-size:.88rem;border-bottom:1px solid var(--line-soft)}
th{background:var(--surface-2);font-weight:700;color:var(--txt-mid);font-size:.76rem;text-transform:uppercase;letter-spacing:.3px}
tbody tr{transition:background .15s;background:var(--surface)}
tbody tr:hover{background:var(--surface-2);cursor:pointer}
tbody tr:last-child td{border-bottom:none}

/* toasts */
#toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--rose);
  padding:12px 16px;border-radius:10px;box-shadow:var(--sh);font-weight:600;max-width:330px;color:var(--txt);
  animation:toastIn .28s ease both;
}
.toast.out{animation:toastOut .25s ease forwards}
.toast.xp{border-left-color:var(--yellow)}
.toast.win{border-left-color:var(--green)}
.toast.ach{border-left-color:var(--purple)}
.toast small{display:block;font-weight:500;color:var(--txt-dim);font-size:.78rem}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,24,32,.42);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:18px;animation:fade .18s ease both}
.modal{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  padding:26px;max-width:520px;width:100%;box-shadow:var(--sh);
  animation:pop .24s ease both;max-height:88vh;overflow-y:auto;
}
.modal.wide{max-width:720px}
.modal h2{margin-bottom:6px}
.modal .close{position:absolute;top:14px;right:16px;font-size:1.2rem;color:var(--txt-dim)}

/* xp float */
.xp-float{position:fixed;z-index:130;font-family:var(--disp);font-weight:800;font-size:1.3rem;color:var(--rose);pointer-events:none;text-shadow:0 2px 8px rgba(255,255,255,.9);animation:floatUp 1s ease-out forwards}

/* ---------- 5. TELAS ---------- */
.hero{
  background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r-l);
  padding:24px 26px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;
  box-shadow:var(--sh-s);
}
.hero .txt{flex:1;min-width:230px}
.hero h1{font-size:1.7rem}
.hero .speech{
  position:relative;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:12px;padding:12px 16px;margin-top:14px;font-weight:500;color:var(--txt-mid);max-width:46ch;
}

.journey{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.jcard{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-l);padding:18px;
  text-align:left;transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:8px;
}
.jcard:hover{border-color:var(--rose);box-shadow:var(--sh)}
.jcard .ico{font-size:1.4rem}
.jcard b{font-family:var(--disp);font-size:1rem;color:var(--txt)}
.jcard small{color:var(--txt-dim);font-weight:500}

.mood-row{display:flex;gap:10px;flex-wrap:wrap}
.mood-btn{
  background:var(--surface-2);border:1.5px solid var(--line-soft);border-radius:14px;
  padding:10px 8px 8px;width:96px;display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:border-color .15s,background .15s;
}
.mood-btn:hover{border-color:var(--rose);background:var(--surface)}
.mood-btn.sel{border-color:var(--rose);background:rgba(48,89,201,.06)}
.mood-btn span{font-size:.74rem;font-weight:700;color:var(--txt-mid)}
.mood-btn.sel span{color:var(--txt)}

.act-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-l);padding:18px;display:flex;flex-direction:column;gap:11px}
.act-card.done{opacity:.6;border-style:dashed}
.act-card h3{font-size:.98rem}
.act-card .desc{color:var(--txt-mid);font-size:.9rem}

.ctx-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.ctx-btn{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-m);
  padding:16px 14px;text-align:left;transition:border-color .15s,box-shadow .15s;
}
.ctx-btn:hover{border-color:var(--rose);box-shadow:var(--sh-s)}
.ctx-btn .ico{font-size:1.35rem;display:block;margin-bottom:6px}
.ctx-btn b{display:block;font-family:var(--disp);font-size:.94rem;color:var(--txt)}
.ctx-btn small{color:var(--txt-dim);font-size:.72rem;font-weight:700}
.ctx-btn.random{background:var(--surface-2);border-color:var(--line)}

.play-card{
  background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r-xl);padding:26px;
  box-shadow:var(--sh-s);
  animation:cardFlip .3s ease both;
}
.play-card .prompt{font-family:var(--disp);font-size:1.35rem;line-height:1.35;margin:14px 0;color:var(--txt);font-weight:700}
.tip{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:12px 15px;color:var(--txt-mid);font-size:.9rem}

.streak-day{width:42px;height:54px;border-radius:10px;background:var(--surface-2);border:1.5px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--txt-dim)}
.streak-day.on{background:rgba(199,106,31,.10);border-color:var(--orange);color:var(--orange)}
.streak-day.today{box-shadow:0 0 0 2px var(--rose)}

.ach{display:flex;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:15px}
.ach .medal{width:48px;height:48px;flex:0 0 48px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:var(--surface-3);filter:grayscale(1);opacity:.45}
.ach.on .medal{filter:none;opacity:1;background:rgba(184,134,10,.10)}
.ach.on{border-color:rgba(184,134,10,.25)}
.ach b{display:block;font-family:var(--disp);color:var(--txt)}
.ach small{color:var(--txt-dim);font-size:.8rem}

.skill-row{margin-bottom:15px}
.skill-row .between{margin-bottom:6px;font-weight:600;font-size:.9rem}

.entry{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:16px;margin-bottom:12px}
.entry .qa{margin-top:9px}
.entry .qa b{display:block;font-size:.76rem;color:var(--txt-dim);font-weight:700}
.entry .qa p{color:var(--txt-mid);font-size:.9rem;white-space:pre-wrap}

.evt{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-l);padding:18px;display:flex;flex-direction:column;gap:10px}
.evt .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--txt-dim);font-size:.83rem;font-weight:600}
.evt.joined{border-color:rgba(31,157,104,.3)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:8px 15px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:.84rem;color:var(--txt-dim);border:1px solid var(--line-soft)}
.tab:hover{color:var(--txt)}
.tab.active{background:var(--rose);color:#fff;border-color:var(--rose)}

.mini-bars{display:flex;align-items:flex-end;gap:7px;height:110px}
.mini-bars .b{flex:1;background:var(--rose);border-radius:5px 5px 2px 2px;min-height:4px;position:relative;transition:height .5s ease}
.mini-bars .b small{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:.66rem;color:var(--txt-dim);font-weight:600}

.fdist{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.fdist .lab{width:112px;flex:0 0 112px;font-weight:600;font-size:.85rem;display:flex;align-items:center;gap:6px}
.fdist .bar{flex:1}
.fdist .pct{width:44px;text-align:right;font-weight:700;font-size:.83rem;color:var(--txt-mid)}

/* ---------- 6. MASCOTE ---------- */
.mascot{display:block}
.mascot.bob{animation:bob 3.4s ease-in-out infinite}
.mascot.pop{animation:mascotPop .4s ease both}

/* ---------- 7. ANIMAÇÕES ---------- */
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(24px)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.85)}25%{opacity:1;transform:translateY(-12px) scale(1.05)}100%{opacity:0;transform:translateY(-64px) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes mascotPop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
@keyframes cardFlip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes confFall{to{transform:translateY(110vh) rotate(400deg);opacity:0}}
.confetti{position:fixed;top:-20px;width:9px;height:12px;z-index:125;pointer-events:none;border-radius:2px;animation:confFall 2.4s linear forwards}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- 8. RESPONSIVO ---------- */
.mobile-nav{display:none}
.scrim{display:none}
@media (max-width:1000px){

/* ---------- BIBLIOTECA: CARTAS DE CONVERSA ---------- */
const CARDS_RAW = `

amigos|3|inter|Defenda um amigo em uma situação em que ele está sendo zoado demais.|Você pode cortar o clima sem brigar: mude o assunto na hora.
amigos|1|conv|Pergunte a um amigo qual comida ele comeria todos os dias sem enjoar.|Comida é o assunto mais democrático que existe.
familia|1|conv|Pergunte a alguém da sua família como foi o dia dela, e escute até o fim.|Desligue a tela enquanto ouve. Isso muda tudo.
familia|1|conv|Peça para um familiar contar uma história de quando ele tinha a sua idade.|Pergunte o que ele faria diferente hoje.
familia|2|expr|Conte a alguém da sua família algo que você conquistou recentemente.|Compartilhar vitórias pequenas também é praticar comunicação.
familia|2|conv|Descubra qual era o sonho de infância de alguém da sua família.|Pergunte se ainda sobra alguma coisa daquele sonho hoje.
familia|2|inic|Proponha uma atividade em casa que envolva todo mundo por 30 minutos.|Sem celular na mesa é uma regra que funciona.
familia|3|conf|Converse sobre uma regra da casa que você gostaria de mudar.|Leve uma proposta, não uma reclamação.
familia|3|expr|Peça desculpas a alguém da sua família por uma discussão antiga.|Comece por "eu queria falar de uma coisa que ficou entalada".
familia|1|escu|Pergunte a um familiar sobre o trabalho dele e faça três perguntas seguidas.|Pergunte o que é a parte mais chata; as respostas são ótimas.
familia|2|expr|Diga a alguém da sua família que você é grato por algo específico.|Um exemplo concreto vale mais do que "obrigado por tudo".
familia|2|conv|Pergunte como seus pais ou responsáveis se conheceram.|Peça a versão dos dois lados se puder. Nunca batem.
familia|3|conf|Fale sobre um assunto que você normalmente evita em casa.|Escolha uma hora calma e comece dizendo que é importante para você.
familia|1|conv|Pergunte a um irmão, primo ou parente da sua idade o que ele anda curtindo.|Curiosidade sobre o mundo do outro é um presente barato.
familia|2|escu|Ouça um familiar reclamar sem tentar resolver o problema dele.|Só "isso é chato mesmo" já ajuda muito.
familia|2|inter|Ajude alguém da sua família em algo antes de ser pedido.|Ofereça ajuda específica: "Posso lavar a louça hoje?"
familia|3|expr|Conte a alguém da sua família sobre um plano seu para o futuro.|Explique o porquê antes do quê. O porquê convence.
familia|1|conv|Pergunte a um familiar qual música marcou a juventude dele.|Peça para escutar junto.
familia|2|conv|Descubra qual foi a viagem mais marcante de alguém da sua casa.|Pergunte o que ela lembra do cheiro e da comida do lugar.
familia|3|expr|Converse com um familiar sobre um assunto em que vocês discordam, sem brigar.|Objetivo não é vencer: é entender por que ele pensa assim.
trabalho|1|conv|Puxe assunto com um colega de trabalho ou estágio fora do assunto trabalho.|Fim de semana e planos são temas seguros e verdadeiros.
trabalho|1|inic|Apresente-se a alguém de outro setor que você nunca falou.|"Trabalho ali, vim me apresentar" resolve.
trabalho|2|expr|Peça feedback sobre algo que você entregou.|Pergunte especificamente: "O que eu poderia ter feito melhor aqui?"
trabalho|2|conf|Diga em uma reunião que você não entendeu algo.|Se você não entendeu, é porque não foi bem explicado.
trabalho|2|inic|Ofereça ajuda a um colega que está sobrecarregado.|Ofereça uma tarefa específica, não ajuda genérica.
trabalho|3|conf|Apresente uma ideia sua para alguém mais experiente que você.|Comece pelo problema que sua ideia resolve.
trabalho|3|expr|Discorde de uma decisão em uma reunião, com argumentos.|"Posso trazer outro ângulo?" abre a porta sem confronto.
trabalho|2|escu|Em uma reunião, anote o que os outros disseram antes de falar.|Citar alguém antes de discordar muda o tom da sala.
trabalho|3|conf|Peça mais responsabilidade ou uma tarefa que você quer aprender.|Mostre o que você já fez que prova que consegue.
trabalho|1|conv|Elogie o trabalho de um colega na frente de outras pessoas.|Reconhecimento público vale muito e custa nada.
trabalho|2|expr|Explique o que você faz para alguém que não é da sua área.|Corte os termos técnicos. Se a pessoa entendeu, você explicou bem.
trabalho|3|expr|Avise que um prazo não vai ser cumprido, antes de ele estourar.|Avise cedo, explique o motivo e proponha uma nova data.
trabalho|2|inter|Almoce com alguém do trabalho que você quase não conversa.|Convite simples: "Vai almoçar? Bora junto."
trabalho|1|escu|Pergunte a um colega como ele começou na área dele.|Todo mundo tem uma história de começo e gosta de contar.
trabalho|3|conf|Fale em voz alta em uma reunião nos primeiros cinco minutos.|Falar cedo tira o peso de "quando eu vou falar?".
trabalho|2|expr|Peça algo que você precisa de outra pessoa, com prazo claro.|Pedido sem prazo é pedido ignorado.
trabalho|1|inic|Cumprimente pelo nome todas as pessoas que você cruzar hoje no trabalho.|Comece pelas pessoas que quase ninguém cumprimenta.
trabalho|3|expr|Dê um retorno difícil a alguém, começando pelo que funcionou.|Fale do trabalho, nunca da pessoa.
cotidiano|1|inic|Cumprimente o porteiro, o motorista ou o vizinho que você vê todo dia.|Use o nome se souber. Se não souber, pergunte hoje.
cotidiano|1|conv|Faça um elogio sincero a um desconhecido que te atendeu bem.|Diga o que exatamente a pessoa fez bem.
cotidiano|2|conv|Puxe assunto com um vizinho enquanto espera o elevador.|Comente algo do prédio ou da rua. Trinta segundos bastam.
cotidiano|2|inic|Peça uma informação na rua mesmo sabendo que poderia olhar no celular.|Agradeça olhando nos olhos.
cotidiano|1|escu|Pergunte "como foi seu dia?" a alguém que te atende e escute a resposta.|Espere a segunda frase. É onde mora a conversa.
cotidiano|2|conf|Devolva um produto ou peça a troca de algo com calma e firmeza.|Explique o problema em uma frase e diga o que você quer.
cotidiano|2|conv|Converse com alguém na fila do mercado ou da padaria.|Comente algo que vocês dois estão vendo naquele momento.
cotidiano|3|conf|Reclame educadamente de um serviço mal prestado.|Separe o fato do sentimento e peça uma solução específica.
cotidiano|1|inter|Segure a porta e diga algo além de "de nada".|Um "bom dia" completo muda o tom do encontro.
cotidiano|2|inic|Ofereça ajuda a alguém carregando peso ou perdido na rua.|Pergunte antes de agir: "Precisa de ajuda?"
cotidiano|2|expr|Conte para alguém da sua rotina uma novidade sua.|Compartilhar coisas pequenas é o que cria vínculo.
cotidiano|3|inter|Comece uma conversa com alguém de uma geração bem diferente da sua.|Pergunte como era a rotina da pessoa na idade que você tem.
cotidiano|1|conv|Pergunte a alguém qual a melhor parte do dia dela.|Depois responda a mesma pergunta sobre você.
cotidiano|2|conf|Peça desconto ou condição melhor em uma compra.|Pergunte com simpatia: "Tem alguma condição melhor?"
cotidiano|3|inic|Converse com um desconhecido por mais de três minutos.|Faça duas perguntas de acompanhamento para cada resposta.
cotidiano|1|escu|Escute alguém contar uma história longa sem olhar o celular.|Deixe o aparelho virado para baixo.
festas|1|inic|Você chegou a uma festa e não conhece quase ninguém. Qual seu primeiro movimento?|Vá até quem está sozinho: essa pessoa quer conversar tanto quanto você.
festas|1|conv|Puxe assunto com alguém perto da mesa de comida.|Comentar a comida é a desculpa mais antiga e mais eficiente.
festas|2|conv|Entre em uma roda de conversa que já começou.|Escute um minuto antes de falar, depois comente algo que foi dito.
festas|2|inter|Apresente um amigo seu para outro grupo na festa.|Diga algo que dê assunto: "Ele também joga isso."
festas|2|conf|Diga que você não quer beber ou não quer participar de algo, sem justificar demais.|"Hoje não, valeu" já basta. Repita se precisar.
festas|3|conf|Dance, cante ou participe de algo em público mesmo com vergonha.|Ninguém está olhando tanto quanto sua cabeça diz.
festas|3|inic|Converse com cinco pessoas diferentes em uma mesma festa.|Conversas curtas contam. A meta é a iniciativa, não a profundidade.
festas|1|conv|Pergunte a alguém como essa pessoa conhece o anfitrião.|É a pergunta mais útil de qualquer festa.
festas|2|conv|Saia de uma conversa chata sem ofender ninguém.|"Vou pegar água, já volto" é honesto e educado.
festas|1|inter|Ajude o anfitrião em alguma coisa durante o evento.|Quem ajuda circula e conhece todo mundo naturalmente.
festas|2|expr|Conte uma história sua em uma roda de pessoas.|Comece pelo final interessante e volte para explicar.
festas|3|conf|Proponha uma brincadeira ou um jogo para o grupo na festa.|Explique as regras em três frases e comece você.
festas|2|escu|Descubra a história mais interessante de alguém na festa.|Pergunte: "Qual foi a coisa mais louca que já te aconteceu?"
festas|1|conv|Elogie a organização, a música ou a comida para quem fez.|Especifique o que você gostou.
festas|2|inic|Convide alguém para conversar em um canto mais silencioso.|"Não tô escutando nada aqui, bora ali?"
festas|3|inter|Reaproxime duas pessoas que estão se evitando na festa.|Fale de um interesse em comum e saia de perto depois.
jogos|1|conv|Pergunte a alguém qual jogo marcou a infância dela.|Nostalgia de jogo abre conversa com quase qualquer pessoa.
jogos|1|inter|Convide alguém para jogar algo com você hoje.|Sugira um horário concreto.
jogos|2|conv|Explique as regras de um jogo que você ama para quem nunca jogou.|Comece pelo objetivo, não pelos detalhes.
jogos|2|inic|Entre em um grupo online e fale no microfone pela primeira vez.|Comece só chamando as jogadas. Isso já é falar em público.
jogos|2|conf|Seu time está perdendo. Diga algo que melhore o clima em vez de piorar.|Elogie uma jogada específica de alguém.
jogos|3|conf|Assuma a liderança de uma partida em equipe e dê as orientações.|Instruções curtas e calmas valem mais que gritos.
jogos|2|inter|Peça desculpas por um erro seu durante uma partida em grupo.|"Foi meu erro, bora pra próxima" encerra o assunto.
jogos|1|conv|Pergunte a um amigo qual personagem ele escolheria para ser na vida real.|Depois pergunte o porquê. Sempre é revelador.
jogos|2|escu|Deixe alguém te ensinar um jogo que você já sabe jogar.|Faça perguntas mesmo sabendo as respostas.
jogos|3|expr|Defenda sua opinião sobre um jogo em uma discussão acalorada, sem hostilidade.|Fale do que você sente jogando, não do que é "melhor".
jogos|1|inic|Chame alguém novo para entrar no seu grupo de jogo.|Diga que a vaga é dela e explique como funciona.
jogos|2|conv|Pergunte a alguém o que ela aprendeu com um jogo.|Muita gente aprendeu inglês, estratégia ou paciência assim.
jogos|1|conv|Qual foi a vitória mais suada que você já teve em um jogo? Pergunte e conte a sua.|Detalhes de tensão tornam a história boa.
jogos|2|conf|Admita que você é iniciante em um jogo e peça dicas.|Admitir que não sabe é o atalho mais rápido para aprender.
jogos|3|inter|Organize uma partida ou campeonato entre amigos.|Defina data, jogo e regras. Alguém precisa começar.
jogos|2|inic|Puxe conversa com alguém sobre jogos fora do ambiente de jogos.|Camisetas, chaveiros e mochilas denunciam os fãs.
esportes|1|conv|Pergunte a alguém que esporte ela praticava quando criança.|Pergunte por que parou ou por que continuou.
esportes|1|inter|Convide alguém para jogar bola, caminhar ou treinar com você.|Marque dia e horário na hora.
esportes|2|conf|Entre em um time ou jogo casual em que você não conhece ninguém.|Chegue perguntando: "Tá faltando alguém aí?"
esportes|2|inter|Incentive um colega que errou durante um jogo.|"Boa tentativa, vem de novo" muda a partida inteira.
esportes|2|conv|Converse com alguém sobre um jogo ou campeonato que vocês dois acompanham.|Pergunte a opinião antes de dar a sua.
esportes|3|conf|Assuma um papel de liderança em uma partida ou treino.|Distribua funções e chame pelo nome.
esportes|1|escu|Pergunte a alguém como foi o treino ou o jogo dela.|Pergunte o que foi mais difícil.
esportes|2|expr|Explique uma regra ou tática para alguém que está aprendendo.|Use exemplos do que acabou de acontecer no jogo.
esportes|3|conf|Diga ao grupo que você quer jogar em uma posição diferente.|Explique o que você quer treinar e proponha um teste.
esportes|2|inic|Convide alguém que nunca joga para participar do próximo jogo.|Garanta que a pessoa vai ser bem recebida.
esportes|1|conv|Pergunte qual atleta inspira a pessoa e por quê.|A resposta quase sempre fala sobre valores, não sobre esporte.
esportes|2|conf|Peça para entrar em um jogo já começado.|Pergunte direto e espere a próxima troca.
esportes|3|inter|Resolva um desentendimento durante uma partida, sem discussão.|Proponha continuar e resolver depois do jogo.
esportes|1|inter|Cumprimente todo mundo do time antes do jogo começar.|Um toque de mão e o nome. Simples assim.
esportes|2|escu|Pergunte a um colega mais experiente o que você pode melhorar.|Peça uma coisa só. Uma coisa você consegue treinar.
esportes|1|conv|Conte para alguém sobre o melhor momento esportivo que você já viveu.|Conte o que você sentiu, não só o que aconteceu.
filmes|1|conv|Pergunte a alguém qual filme ela assistiria de novo pela primeira vez.|Depois pergunte qual cena ela mais lembra.
filmes|1|conv|Peça uma recomendação de série e comprometa-se a assistir um episódio.|Volte depois para comentar. Isso cria uma segunda conversa.
filmes|2|expr|Defenda um filme que quase todo mundo detesta.|Diga o que ele te fez sentir. Sentimento não se discute.
filmes|2|conv|Descubra qual gênero de filme alguém nunca assistiria e por quê.|O que a pessoa evita diz muito sobre ela.
filmes|2|inic|Convide alguém para assistir algo com você.|Escolha duas opções e deixe a pessoa decidir.
filmes|1|conv|Qual personagem você levaria para um jantar? Pergunte isso a alguém.|Pergunte o que ela perguntaria ao personagem.
filmes|2|escu|Ouça alguém contar o enredo de um filme sem dizer que já assistiu.|Reagir com curiosidade é um exercício e tanto.
filmes|3|expr|Explique por que um filme mudou a forma como você pensa sobre algo.|Conecte com uma situação real da sua vida.
filmes|2|conv|Discuta um final de série polêmico com alguém que discorda de você.|Pergunte o que ela teria feito diferente.
filmes|1|conv|Pergunte qual foi o último filme que fez alguém chorar.|Não zoe a resposta. Aproveite a abertura.
filmes|3|inter|Organize uma sessão de filme com um grupo.|Deixe a escolha em votação para envolver todo mundo.
filmes|2|conv|Fale sobre uma cena que você não consegue esquecer.|Descreva a cena antes de explicar o motivo.
filmes|1|conv|Pergunte a alguém qual filme ela viu tantas vezes que sabe as falas.|Peça para a pessoa citar uma fala.
filmes|2|expr|Recomende um filme para alguém explicando por que é a cara dela.|Personalizar a recomendação é um elogio disfarçado.
filmes|3|conv|Puxe uma conversa sobre um tema difícil a partir de um filme.|Filmes deixam assuntos pesados mais fáceis de começar.
filmes|1|escu|Pergunte a opinião de alguém sobre um filme e não interrompa até o fim.|Guarde seu ponto para o final.
musica|1|conv|Pergunte a alguém qual música está no repeat dela agora.|Peça para ouvir um trecho junto.
musica|1|inter|Monte uma playlist com um amigo, cada um escolhendo uma música por vez.|Comente por que escolheu cada uma.
musica|2|conv|Descubra qual música marca uma fase da vida de alguém.|Pergunte o que estava acontecendo naquela época.
musica|2|expr|Mostre uma música que você ama para alguém e explique por quê.|Diga o que você sente, não o que é tecnicamente bom.
musica|3|conf|Cante ou toque algo na frente de outras pessoas.|Escolha algo que você já sabe de cor.
musica|2|inic|Convide alguém para ir a um show, ensaio ou karaokê.|Proponha a data antes de perguntar se a pessoa gosta.
musica|1|conv|Qual música te dá energia? Pergunte e compartilhe a sua.|Troque uma música por dia com alguém durante uma semana.
musica|2|escu|Ouça a playlist de alguém inteira e comente três músicas.|Comentários específicos mostram atenção real.
musica|3|expr|Fale sobre um gosto musical seu que costumam zoar.|Defender o que você gosta é treino de confiança.
musica|2|conv|Pergunte se alguém já quis aprender um instrumento.|Pergunte o que impediu. Esse assunto vai longe.
musica|1|conv|Pergunte qual show a pessoa mais gostaria de ir na vida.|Inclua artistas que já não tocam mais.
musica|2|inter|Compartilhe fones com alguém e ouçam uma música juntos.|Proximidade física simples também é interação.
musica|1|escu|Peça uma recomendação musical e escute de verdade.|Volte com um retorno sincero, mesmo que não tenha curtido.
musica|3|conf|Cante junto em um lugar público com amigos.|Comece baixinho. O resto vem sozinho.
musica|2|conv|Fale sobre uma letra de música que diz algo que você sente.|Letras são um jeito seguro de falar de sentimentos.
musica|2|inic|Puxe conversa com alguém que está usando uma camisa de banda.|"Você já viu eles ao vivo?" nunca falha.
estudos|1|conv|Pergunte a alguém como ela estuda e o que funciona melhor.|Teste o método dela por um dia e comente depois.
estudos|2|inic|Monte um grupo de estudos com pelo menos duas pessoas.|Defina uma matéria e um horário fixo.
estudos|2|expr|Explique em voz alta para alguém um conteúdo que você acabou de aprender.|Ensinar é o teste real de que você entendeu.
estudos|1|conv|Pergunte a um colega qual assunto ele acha mais difícil.|Ofereça ajuda se você domina aquilo.
estudos|2|conf|Admita em um grupo de estudos que você está perdido em um tema.|Alguém vai se sentir aliviado por não ser o único.
estudos|3|expr|Apresente um resumo de um conteúdo para um grupo.|Cinco minutos e três pontos principais.
estudos|2|escu|Escute a explicação de alguém até o fim antes de dizer que já sabia.|"Já sei" mata conversas.
estudos|1|inic|Peça a alguém para revisar um trabalho seu.|Pergunte por algo específico: clareza, erros, ideias.
estudos|2|conv|Converse sobre o que você quer fazer depois de terminar os estudos.|Pergunte os planos do outro primeiro.
estudos|3|conf|Peça uma segunda chance ou uma revisão de nota, com argumentos.|Leve o que você fez, não só o que sentiu.
estudos|2|inter|Divida suas anotações com alguém que faltou.|Ofereça explicar a parte mais confusa.
estudos|1|conv|Pergunte a alguém qual professor mais marcou a vida dela.|Pergunte o que aquele professor fazia de diferente.
estudos|2|expr|Conte a alguém sobre um assunto que você estuda por prazer.|Empolgação genuína prende atenção.
estudos|3|inic|Procure alguém mais experiente e peça orientação sobre um caminho de estudo.|Chegue com uma pergunta específica pronta.
estudos|1|escu|Pergunte a alguém o que a motiva a estudar.|Não julgue a resposta, mesmo que seja "obrigação".
estudos|2|conf|Diga em voz alta que você errou algo e o que aprendeu com isso.|Erros contados viram autoridade, não vergonha.
viagens|1|conv|Pergunte a alguém qual lugar ela mais quer conhecer.|Pergunte o que ela faria no primeiro dia lá.
viagens|1|conv|Conte sobre a viagem mais marcante que você já fez.|Comece por um detalhe pequeno: um cheiro, uma comida, uma pessoa.
viagens|2|conf|Peça informação a um desconhecido em um lugar que você não conhece.|Comece com licença e diga onde quer chegar.
viagens|2|conv|Pergunte a alguém sobre a cidade natal dela.|Peça o que um turista nunca descobriria sozinho.
viagens|2|inic|Puxe conversa com alguém que você conheceu em uma viagem ou passeio.|"De onde vocês são?" abre tudo.
viagens|3|conf|Converse com alguém de outro país ou outra língua.|Gestos e boa vontade cobrem o que falta de vocabulário.
viagens|1|conv|Qual viagem você faria se dinheiro não fosse problema? Pergunte a alguém.|Pergunte com quem a pessoa iria.
viagens|2|escu|Ouça alguém contar uma viagem inteira sem comparar com as suas.|Resista à vontade de dizer "eu também fui".
viagens|2|expr|Recomende um lugar da sua cidade para alguém de fora.|Explique o melhor horário e o que pedir lá.
viagens|3|inic|Organize um passeio com amigos, do começo ao fim.|Alguém precisa marcar. Seja essa pessoa.
viagens|1|conv|Pergunte qual foi o perrengue de viagem mais engraçado que a pessoa já passou.|Conte o seu depois. Perrengues unem.
viagens|2|conv|Descubra que tipo de viajante alguém é: planejador ou improvisador.|Pergunte como foi a última viagem para confirmar.
viagens|1|inter|Ofereça ajuda a um turista perdido.|Aponte a direção e diga um ponto de referência.
viagens|2|conv|Pergunte o que alguém sempre leva na mala e não abre mão.|Respostas engraçadas aparecem sempre.
viagens|3|conf|Viaje ou vá sozinho a um lugar novo e converse com pelo menos uma pessoa.|Funcionários e atendentes são o começo mais fácil.
viagens|1|escu|Peça dicas de viagem a alguém que já foi onde você quer ir.|Anote na frente da pessoa. Isso valoriza a ajuda.
lojas|1|conf|Peça ajuda a um vendedor em vez de procurar sozinho.|Diga o que você procura e para quê.
lojas|1|conv|Elogie o atendimento de alguém que te atendeu bem.|Diga isso para a pessoa, não só para o gerente.
lojas|2|conf|Pergunte o preço de algo caro sem se sentir constrangido.|Perguntar preço é normal. Você não deve nada a ninguém.
lojas|2|conf|Diga "não, obrigado" a um vendedor insistente, com firmeza e educação.|Repita a mesma frase. Não invente explicações.
lojas|2|expr|Explique claramente o que você quer para um vendedor.|Diga o uso, o tamanho e a faixa de preço.
lojas|3|conf|Troque ou devolva um produto com defeito.|Leve a nota e explique o problema em uma frase.
lojas|1|conv|Puxe assunto com alguém na fila do caixa.|Comente algo sobre a espera com bom humor.
lojas|2|inic|Peça a opinião de um desconhecido sobre uma escolha de compra.|"Qual dos dois fica melhor?" é um pedido simpático.
lojas|2|conf|Pergunte se existe uma opção mais barata do que a que te ofereceram.|Você pode perguntar sem justificar.
lojas|1|escu|Ouça as recomendações de um vendedor até o fim antes de decidir.|Faça uma pergunta sobre o que ele disse.
lojas|3|conf|Reclame de uma cobrança errada sem elevar o tom.|Fatos, documento e o que você quer que aconteça.
lojas|2|conv|Pergunte ao atendente qual produto ele realmente usa.|Respostas honestas aparecem quando você pergunta assim.
lojas|1|inter|Agradeça pelo nome a quem te atendeu.|Leia o crachá e use o nome.
lojas|2|conf|Peça para experimentar ou testar algo antes de comprar.|Pedir é parte do processo, não um favor.
lojas|3|inic|Negocie o preço ou a forma de pagamento de uma compra.|Pergunte, espere em silêncio e deixe a outra pessoa responder.
lojas|1|conv|Pergunte a um vendedor como foi o movimento do dia.|Quem trabalha em pé o dia todo agradece uma conversa humana.
restaurantes|1|conf|Peça sua comida sem pressa e faça uma pergunta sobre o prato.|Perguntar como vem servido é normal e útil.
restaurantes|1|conv|Pergunte ao garçom o que ele recomenda de verdade.|Diga o que você gosta para ele acertar.
restaurantes|2|conf|Devolva um prato que veio errado, com educação.|Explique o que foi pedido e o que chegou.
restaurantes|2|conv|Puxe assunto com as pessoas da sua mesa sobre comida da infância.|Comida da infância é um tema afetivo garantido.
restaurantes|2|conf|Peça uma modificação no prato (sem cebola, molho à parte).|Pedir adaptação é comum. Diga com clareza e agradeça.
restaurantes|1|inter|Agradeça ao garçom pelo nome no fim da refeição.|Deixe um elogio específico se o serviço foi bom.
restaurantes|3|conf|Coma sozinho em um restaurante e converse com alguém lá.|Sente-se no balcão. Conversa acontece sozinha.
restaurantes|2|inic|Escolha o restaurante para o grupo quando ninguém decide.|Proponha duas opções e peça votos.
restaurantes|1|conv|Pergunte a alguém qual é a comida preferida dela e por quê.|Peça para a pessoa descrever o sabor.
restaurantes|2|escu|Deixe todo mundo pedir antes de você e repare nas escolhas.|Depois comente algo sobre o pedido de alguém.
restaurantes|2|conv|Convença a mesa a experimentar algo diferente.|Ofereça dividir para reduzir o risco.
restaurantes|3|conf|Resolva um erro na conta com calma e clareza.|Aponte o item e pergunte o que houve.
restaurantes|1|conv|Conte sobre o pior prato que você já comeu.|Histórias ruins são as mais engraçadas.
restaurantes|2|inic|Convide alguém para almoçar ou lanchar hoje.|Convite espontâneo tem mais chance de ser aceito.
restaurantes|1|escu|Pergunte ao garçom qual o prato mais pedido e o porquê.|Informação prática vira conversa.
restaurantes|2|expr|Descreva um sabor para alguém que nunca provou aquele prato.|Compare com algo que a pessoa conhece.
transporte|1|inic|Ceda o lugar a alguém e diga algo além de apenas levantar.|Um "senta aqui" simpático basta.
transporte|1|conv|Puxe assunto com alguém que espera o mesmo ônibus todo dia.|Comente o atraso. Todo mundo quer reclamar disso.
transporte|2|conf|Pergunte ao motorista se o trajeto passa onde você precisa.|Pergunte antes de subir; evita constrangimento depois.
transporte|2|inter|Ajude alguém com bagagem, carrinho ou dificuldade de locomoção.|Ofereça antes de pegar em qualquer coisa.
transporte|2|conv|Converse com um motorista de aplicativo sobre o dia dele.|Pergunte há quanto tempo ele roda por essa região.
transporte|3|conf|Peça para alguém abaixar o volume ou parar um comportamento incômodo.|Frase curta, tom calmo, pedido claro.
transporte|1|escu|Escute alguém contar sobre o trajeto e a rotina dela.|Pergunte quanto tempo a pessoa gasta por dia.
transporte|2|conf|Peça informação sobre qual linha ou plataforma usar.|Funcionários da estação são a melhor fonte.
transporte|1|conv|Pergunte a alguém qual é o pior trajeto que ela já fez.|Todo mundo tem uma história de trânsito.
transporte|2|inic|Ofereça carona ou companhia no caminho a um colega.|Convite no fim da aula ou do expediente é natural.
transporte|3|inter|Ajude alguém perdido a encontrar o caminho, mesmo que te atrase um pouco.|Leve a pessoa até um ponto visível.
transporte|1|conv|Agradeça ao motorista ao descer, olhando para ele.|Um gesto de dois segundos.
transporte|2|conv|Puxe assunto sobre música ou podcast com quem está de fone.|Espere a pessoa tirar o fone. Respeite o não.
transporte|2|escu|Pergunte a alguém como ela aproveita o tempo no transporte.|Ideias boas aparecem nessa pergunta.
transporte|3|conf|Avise em voz alta quando alguém deixar cair algo ou esquecer um objeto.|Falar alto em público é um ótimo treino de coragem.
transporte|1|inter|Cumprimente o cobrador, o segurança ou o funcionário da estação.|Faça isso a semana toda e veja o que muda.
internet|1|conv|Comente de forma gentil em uma publicação de alguém que você admira.|Comente sobre o conteúdo, não sobre a pessoa.
internet|2|inic|Mande mensagem para alguém que produz algo que você gosta.|Diga o que especificamente te ajudou.
internet|2|conf|Participe de uma discussão online sem agressividade.|Pergunte antes de discordar.
internet|2|expr|Escreva um texto curto sobre algo que você aprendeu e publique.|Explique como se estivesse falando com um amigo.
internet|3|conf|Grave um áudio ou vídeo falando sobre um assunto que você domina.|Uma tomada só. Não precisa ficar perfeito.
internet|1|escu|Leia os comentários de um post até o fim antes de responder.|Você vai descobrir que muita gente já disse o que você ia dizer.
internet|2|inter|Entre em uma comunidade online e se apresente.|Diga quem é você e o que te trouxe até ali.
internet|2|conv|Puxe conversa por mensagem com alguém que você segue há tempos.|Comece por algo que a pessoa publicou.
internet|3|conf|Discorde de alguém online mantendo o respeito até o fim.|Se esquentar, saia. Você não precisa vencer.
internet|1|conv|Mande um áudio em vez de texto para alguém hoje.|Voz transmite intenção melhor que texto.
internet|2|expr|Explique por escrito uma ideia sua em até cinco linhas.|Corte tudo que não muda o entendimento.
internet|2|conf|Faça uma pergunta em um fórum ou grupo mesmo achando que é básica.|Perguntas básicas ajudam centenas de pessoas caladas.
internet|1|inter|Responda a três mensagens que estão paradas na sua caixa.|Responder tarde é melhor do que não responder.
internet|3|inic|Peça ajuda pública para um projeto ou objetivo seu.|Diga exatamente que tipo de ajuda você precisa.
internet|2|escu|Peça feedback sobre algo que você postou.|Pergunte o que ficou confuso.
internet|1|conv|Marque um amigo em algo que lembrou dele e explique o porquê.|A explicação é o que transforma a marcação em conversa.
redes|1|conv|Mande mensagem para três pessoas diferentes hoje só para saber como estão.|Sem pedir nada. Só perguntar.
redes|2|conf|Publique algo pessoal seu, mesmo com receio da reação.|Comece por um assunto leve que você domina.
redes|2|expr|Escreva uma legenda que conte uma história em vez de descrever a foto.|Comece pelo momento, não pelo lugar.
redes|1|escu|Responda com uma pergunta ao story de alguém.|Perguntas transformam visualização em conversa.
redes|2|inic|Chame para uma conversa por chamada alguém com quem você só troca texto.|"Bora falar por áudio? É mais rápido."
redes|3|conf|Poste uma opinião sua sobre um tema que te importa.|Escreva o que você pensa e por quê. Só isso.
redes|2|conv|Puxe assunto com alguém a partir de algo que a pessoa compartilhou.|Comente um detalhe, não o todo.
redes|1|inter|Parabenize alguém por uma conquista publicada.|Escreva uma frase personalizada, não um emoji só.
redes|2|conf|Diga que você não vai responder agora porque está ocupado, em vez de sumir.|Transparência evita mal-entendidos.
redes|3|expr|Grave um vídeo curto se apresentando.|Fale como se estivesse explicando para um amigo.
redes|1|conv|Pergunte a alguém que conteúdo ela mais consome hoje.|Peça uma recomendação e volte para comentar.
redes|2|escu|Leia com atenção um desabafo de alguém e responda no privado.|Mensagem privada vale mais que comentário público.
redes|2|inic|Reative uma conversa antiga com uma pergunta específica.|Evite "sumida". Prefira "lembrei de você quando vi isso".
redes|3|conf|Peça desculpas publicamente por algo que você escreveu errado.|Reconhecer erro em público é raro e admirável.
redes|1|conv|Compartilhe algo que te fez rir com alguém que precisa rir hoje.|Mande com uma frase sua junto.
redes|2|expr|Resuma sua semana em três frases e mande para alguém próximo.|Escolher o que contar já é praticar comunicação.
apresentacoes|1|conf|Fale uma frase em voz alta para um grupo pequeno.|Respire fundo antes. A voz sai mais firme.
apresentacoes|2|expr|Estruture uma apresentação em começo, meio e fim antes de montar os slides.|Uma ideia por slide.
apresentacoes|2|conf|Faça uma pergunta para a plateia durante sua fala.|Pergunta tira o peso de ser o único falando.
apresentacoes|3|conf|Apresente um tema sem ler nenhum papel.|Decore apenas os três pontos principais.
apresentacoes|2|expr|Comece uma apresentação com uma história em vez de uma definição.|Histórias prendem antes que o cérebro decida se importar.
apresentacoes|1|expr|Treine sua apresentação em voz alta, sozinho, do começo ao fim.|Cronometre. Quase todo mundo fala mais rápido no nervoso.
apresentacoes|3|conf|Responda a uma pergunta difícil no meio da sua apresentação.|"Boa pergunta, não sei, vou verificar" é uma resposta válida.
apresentacoes|2|conf|Faça contato visual com três pessoas diferentes durante sua fala.|Fique uma frase inteira em cada uma.
apresentacoes|2|expr|Explique um dado ou número usando uma comparação do dia a dia.|Números só significam algo quando comparados.
apresentacoes|1|conf|Apresente-se antes de começar, mesmo que todos te conheçam.|Isso dá tempo para sua voz se estabilizar.
apresentacoes|3|conf|Ofereça-se voluntariamente para apresentar algo.|Levantar a mão é metade do trabalho.
apresentacoes|2|expr|Encerre sua fala com uma frase pensada, não com "é isso".|Repita a ideia principal em outras palavras.
apresentacoes|2|conf|Fale mais devagar do que o normal durante uma apresentação inteira.|Pausas parecem enormes para você e naturais para o público.
apresentacoes|1|escu|Assista à apresentação de um colega e dê um retorno específico.|Diga uma coisa boa e uma sugestão.
apresentacoes|3|expr|Apresente uma ideia em dois minutos, sem apoio visual.|Se você precisa de slide para se lembrar, simplifique a ideia.
apresentacoes|2|conf|Use as mãos de propósito durante uma fala.|Gestos gastam o nervosismo que sobra.
professores|1|conf|Faça uma pergunta ao professor depois da aula.|Pergunte sobre algo específico da explicação.
professores|1|conv|Agradeça a um professor por uma aula que te marcou.|Diga qual aula e por quê.
professores|2|conf|Peça ajuda a um professor em uma matéria que você está indo mal.|Mostre o que você já tentou sozinho.
professores|2|expr|Sugira ao professor um assunto que a turma gostaria de estudar.|Explique o que a turma ganharia com isso.
professores|3|conf|Converse com um professor sobre uma nota que você achou injusta.|Pergunte o critério antes de contestar.
professores|2|conv|Pergunte a um professor como ele escolheu a área dele.|Professores adoram essa pergunta e quase nunca a recebem.
professores|1|escu|Ouça uma aula inteira sem celular e faça uma pergunta no fim.|Anote a pergunta enquanto ela aparece.
professores|3|inic|Peça a um professor orientação sobre seu futuro ou sua carreira.|Chegue com dúvida específica, não com "não sei o que fazer".
professores|2|expr|Diga a um professor o que funciona melhor para você aprender.|Fale de você, não do método dele.
professores|2|conf|Avise um professor com antecedência sobre um problema que vai afetar sua entrega.|Antecipar resolve quase tudo.
professores|1|conv|Cumprimente seus professores pelo nome ao chegar.|Isso muda a relação em poucas semanas.
professores|3|conf|Peça feedback detalhado sobre um trabalho seu.|Pergunte o que faria virar a nota máxima.
professores|2|inic|Ofereça ajuda em um projeto ou atividade do professor.|Mostre o que você faz bem.
professores|1|escu|Pergunte a um professor qual foi o melhor conselho que ele já recebeu.|Vale anotar a resposta.
professores|2|expr|Explique ao professor por que você discorda de uma ideia da aula.|Traga um argumento, não só uma opinião.
professores|3|conf|Converse com a coordenação sobre uma questão da sua turma.|Represente o grupo com fatos e proposta.
equipe|1|inter|Pergunte a cada pessoa do grupo qual parte ela prefere fazer.|Quem escolhe entrega melhor.
equipe|2|expr|Resuma em voz alta o que foi combinado no fim de uma reunião.|Isso evita metade dos problemas futuros.
equipe|2|conf|Diga ao grupo que você não vai conseguir fazer algo no prazo.|Avise cedo e proponha alternativa.
equipe|2|inic|Assuma a organização das tarefas do grupo.|Lista simples, nomes e prazos.
equipe|3|conf|Cobre alguém do grupo que não está entregando.|Pergunte se está tudo bem antes de cobrar.
equipe|2|escu|Peça a opinião de quem ainda não falou na reunião.|Chame pelo nome: "E você, o que acha?"
equipe|1|inter|Elogie a contribuição de alguém do grupo na frente dos outros.|Seja específico sobre o que a pessoa fez.
equipe|3|expr|Medie um desacordo entre duas pessoas do grupo.|Repita o ponto de cada uma antes de sugerir saída.
equipe|2|conf|Apresente o trabalho do grupo, mesmo sem ser sua parte.|Dê crédito a todo mundo pelo nome.
equipe|2|expr|Proponha uma mudança na forma como o grupo trabalha.|Traga o problema e uma solução testável.
equipe|1|escu|Ouça a ideia de alguém até o fim antes de dizer o que você acha.|Anote enquanto ouve para não interromper.
equipe|2|inter|Puxe um combinado de como o grupo vai se comunicar.|Onde falar, com que frequência, até quando responder.
equipe|3|conf|Assuma um erro do grupo publicamente sem culpar ninguém.|"A gente errou aqui e vai corrigir assim."
equipe|1|conv|Pergunte a alguém do grupo como foi a semana dela antes de falar de tarefa.|Trinta segundos de humanidade melhoram o resto.
equipe|2|inic|Reúna o grupo quando as coisas estiverem paradas.|Marque um horário curto e objetivo.
equipe|2|expr|Explique sua parte do trabalho de forma que qualquer um entenda.|Teste com alguém de fora.
profundas|2|conv|Pergunte a alguém o que ela mudaria na própria vida se pudesse.|Não julgue. Só escute.
profundas|2|conv|O que te dá mais orgulho até hoje? Faça essa pergunta a alguém próximo.|Compartilhe a sua resposta depois.
profundas|3|expr|Fale sobre um medo seu com alguém em quem você confia.|Comece com "eu nunca falei isso, mas...".
profundas|2|conv|Pergunte o que alguém aprendeu com uma fase difícil.|Pergunte o que ajudou a passar por aquilo.
profundas|3|conv|Converse com alguém sobre o que é sucesso para cada um de vocês.|Definições diferentes revelam valores diferentes.
profundas|2|escu|Ouça alguém falar de um assunto sério sem tentar animar a pessoa.|Conforto às vezes é só ficar junto.
profundas|3|expr|Diga a alguém o quanto essa pessoa é importante para você.|Cite um momento específico.
profundas|2|conv|Pergunte de que forma alguém gostaria de ser lembrado.|Pergunta grande, respostas surpreendentes.
profundas|2|conv|O que você faria se não tivesse medo de errar? Pergunte e responda junto.|Escreva as respostas. Vale reler depois.
profundas|3|conf|Converse sobre um arrependimento seu.|Fale do que você aprendeu, não só do que doeu.
profundas|2|escu|Pergunte a alguém o que ela precisa quando está mal.|As pessoas precisam de coisas bem diferentes.
profundas|2|conv|Pergunte qual conselho alguém daria para si mesmo aos 15 anos.|Depois pergunte se a pessoa segue esse conselho hoje.
profundas|3|expr|Conte a alguém uma coisa que mudou sua forma de ver o mundo.|Explique o antes e o depois.
profundas|2|conv|Descubra o que faz alguém se sentir realmente em paz.|Pergunte quando foi a última vez que a pessoa sentiu isso.
profundas|3|conv|Converse sobre o que vocês dois querem para daqui a dez anos.|Pergunte qual é o primeiro passo disso.
profundas|2|escu|Passe uma conversa inteira fazendo só perguntas.|Veja até onde a conversa vai sem você falar de si.
relacoes|2|expr|Diga a alguém próximo algo que você sente e nunca falou.|Comece pequeno. Não precisa ser tudo de uma vez.
relacoes|2|conv|Pergunte a alguém o que faz ela se sentir cuidada.|As respostas raramente são o que a gente imagina.
relacoes|3|conf|Converse sobre algo que te incomoda em uma relação importante.|Fale do comportamento e do que você sente, não da pessoa.
relacoes|2|escu|Escute um desabafo sem dizer "eu avisei".|Guarde para outro dia se ainda achar necessário.
relacoes|2|conv|Pergunte a alguém como ela percebe que gosta de uma pessoa.|Conversa leve e reveladora.
relacoes|3|conf|Convide alguém para sair pela primeira vez.|Proponha algo concreto e curto. Sem pressão.
relacoes|2|expr|Elogie alguém que você gosta sem esperar resposta.|Elogie o jeito, não só a aparência.
relacoes|3|conf|Diga a alguém que você precisa de espaço, sem sumir.|Explique que é sobre você, não contra a pessoa.
relacoes|2|conv|Pergunte a um casal mais velho o que mantém uma relação de pé.|Respostas simples e valiosas.
relacoes|3|expr|Tenha uma conversa que você vem adiando há semanas.|Escolha hora calma e comece pelo motivo.
relacoes|2|escu|Pergunte a alguém como foi o dia dela e não fale de você por cinco minutos.|Faça três perguntas seguidas.
relacoes|2|conf|Diga não a algo que você não quer fazer em uma relação.|Um não claro protege a relação mais do que um sim falso.
relacoes|3|expr|Agradeça a alguém por algo que ela faz e você nunca comentou.|Coisas invisíveis merecem ser ditas.
relacoes|2|conv|Descubra qual foi a primeira impressão que alguém teve de você.|Pergunte o que mudou desde então.
relacoes|3|conf|Resolva uma discussão antiga em vez de deixar passar.|Comece dizendo que a relação importa mais que a briga.
relacoes|2|conv|Pergunte o que a amizade de vocês significa para a outra pessoa.|Responda também. Essa troca marca.
constrangedoras|1|conf|Você chamou alguém pelo nome errado. O que dizer agora?|Corrija com humor e siga em frente. Ninguém guarda isso.
constrangedoras|1|conf|Você acenou para alguém que acenava para outra pessoa. E agora?|Transforme o aceno em um alongamento e ria de si mesmo.
constrangedoras|2|conf|Você esqueceu completamente o nome de alguém que te cumprimentou. Como sair dessa?|Apresente a pessoa a quem está com você: ela vai dizer o próprio nome.
constrangedoras|2|conf|Você contou uma piada e ninguém riu. Qual a melhor reação?|Comente a própria piada: "Bom, na minha cabeça era engraçada."
constrangedoras|2|conf|Você interrompeu alguém sem querer. Como corrigir na hora?|"Desculpa, pode terminar" resolve em dois segundos.
constrangedoras|2|conv|Você entrou na conversa errada achando que era com você. E agora?|"Ignorem, eu me convidei sozinho" costuma render risada.
constrangedoras|3|conf|Você falou mal de alguém e a pessoa ouviu. Como lidar?|Procure a pessoa, assuma e peça desculpa sem justificar.
constrangedoras|2|conf|Seu barulho de estômago cortou o silêncio da sala. O que fazer?|Comente antes que alguém comente. Vira piada sua.
constrangedoras|2|conf|Você tropeçou na frente de várias pessoas. Como se recuperar?|Levante, faça uma reverência mental e siga. Foi um segundo.
constrangedoras|3|conf|Você mandou uma mensagem para a pessoa errada. Como resolver?|Avise você mesmo, com honestidade e brevidade.
constrangedoras|2|conv|Ficou um silêncio longo e desconfortável na conversa. Como retomar?|Pergunte algo sobre o que a pessoa falou cinco minutos antes.
constrangedoras|2|conf|Você errou o nome de uma cidade, banda ou pessoa em público. E agora?|"Corrigindo aqui" e segue. Erro assumido não vira vergonha.
constrangedoras|2|conf|Você chegou muito arrumado ou muito casual para um evento. Como agir?|Comente com bom humor e esqueça. As pessoas esquecem em cinco minutos.
constrangedoras|3|conf|Você elogiou algo e a pessoa levou a mal. Como consertar?|Explique a intenção e pergunte o que soou estranho.
constrangedoras|2|conf|Você chorou na frente de outras pessoas. Como seguir a conversa?|"Foi mal, isso mexeu comigo" é o suficiente.
constrangedoras|2|conf|Você se atrasou muito e todos estavam esperando. O que dizer ao chegar?|Peça desculpa uma vez só e não faça discurso.
constrangedoras|3|conf|Você perguntou algo muito pessoal sem perceber. Como recuar?|"Esquece essa pergunta, foi invasiva" mostra maturidade.
constrangedoras|2|conv|Você não entendeu nada do que a pessoa falou pela terceira vez. E agora?|"Me explica de outro jeito?" é melhor do que fingir.
constrangedoras|2|conf|Seu celular tocou alto em um momento silencioso. Como reagir?|Silencie, faça um gesto de desculpa e continue.
constrangedoras|3|conf|Você discordou de alguém em público e o clima ficou pesado. Como fechar?|Reconheça o ponto da pessoa e proponha continuar depois.
constrangedoras|1|conf|Você falou junto com outra pessoa ao mesmo tempo. O que fazer?|"Pode falar" e deixe a outra começar.
constrangedoras|2|conf|Você não lembrava que já tinha contado aquela história para a pessoa.|"Eu já contei isso, né?" e ria junto.
constrangedoras|3|conf|Você foi corrigido publicamente sobre algo que disse errado.|Agradeça a correção em voz alta. Isso desarma qualquer clima.
constrangedoras|2|conf|Você se ofereceu para ajudar e atrapalhou.|Ria, peça instrução e tente de novo.
constrangedoras|2|conv|Você encontrou alguém que claramente te conhece e você não faz ideia de quem é.|"Me ajuda aqui, de onde a gente se conhece?"
constrangedoras|3|conf|Você congelou no meio de uma fala em público. Como retomar?|Beba água, diga "deixa eu retomar" e volte ao último ponto.
constrangedoras|2|conf|Você riu de algo sério sem querer.|Assuma o nervoso: "Rio quando fico sem graça, desculpa."
constrangedoras|2|conf|Você foi o único que não entendeu a piada do grupo.|Peça para explicarem. Metade da mesa vai agradecer.
constrangedoras|3|conf|Você falou uma opinião impopular e virou o centro das atenções.|Explique o raciocínio com calma e escute a resposta.
dificeis|2|expr|Você precisa dizer não a alguém importante. Como começar?|Diga o não primeiro e o motivo depois.
dificeis|3|conf|Alguém passou dos limites com você. Como falar sobre isso?|Nomeie o que aconteceu e diga o que você espera daqui em diante.
dificeis|3|expr|Você precisa cobrar algo de alguém pela terceira vez.|Mude o tom: pergunte o que está impedindo.
dificeis|2|escu|Alguém está desabafando sobre algo grave. O que dizer?|"Estou aqui" vale mais do que qualquer conselho.
dificeis|3|conf|Você precisa contar uma notícia ruim a alguém.|Diga logo, sem enrolação, e fique para o que vier.
dificeis|3|expr|Você quer terminar uma amizade ou relação que te faz mal.|Fale do que você precisa, não da lista de defeitos da pessoa.
dificeis|2|conf|Alguém fez uma piada ofensiva perto de você. O que dizer?|"Não achei legal" é curto e suficiente.
dificeis|3|conf|Você precisa pedir ajuda para um problema pessoal sério.|Escolha uma pessoa e diga o que exatamente você precisa.

/* ---------- PARSING DAS BIBLIOTECAS ---------- */
function parseLib(raw, prefix){
  const out = [];
  raw.split('\n').forEach(line=>{
    line = line.trim();
    if(!line) return;
    const p = line.split('|');
    if(p.length < 5) return;
    const item = {
      id: prefix + (out.length+1),
      ctx: p[0].trim(),
      dif: parseInt(p[1],10) || 1,
      skill: p[2].trim(),
      title: p[3].trim(),
      text: p[4].trim()
    };
    out.push(item);
  });
  return out;
}
const CARDS      = parseLib(CARDS_RAW, 'c');
const CHALLENGES = parseLib(CHALLENGES_RAW, 'd');
const MISSIONS   = parseLib(MISSIONS_RAW, 'm');
const LIB = {card:CARDS, challenge:CHALLENGES, mission:MISSIONS};

function skillOf(id){ return SKILL_BY_ID[id] || SKILLS[0] }

/* ---------- NÍVEIS ---------- */
const LEVELS = [
  {n:1, name:'Primeiro Passo', xp:0},
  {n:2, name:'Desinibido', xp:120},
  {n:3, name:'Comunicador', xp:320},
  {n:4, name:'Conector', xp:640},
  {n:5, name:'Confiante', xp:1080},
  {n:6, name:'Mestre da Conversa', xp:1650},
  {n:7, name:'Voz da Turma', xp:2400},
  {n:8, name:'Lenda do Speak Up', xp:3400}
];
function levelOf(xp){
  let lv = LEVELS[0];
  for(const l of LEVELS) if(xp >= l.xp) lv = l;
  return lv;
}
function nextLevel(xp){
  return LEVELS.find(l=>l.xp > xp) || null;
}
function levelProgress(xp){
  const cur = levelOf(xp), nxt = nextLevel(xp);
  if(!nxt) return {pct:100, cur, nxt:null, need:0};
  const span = nxt.xp - cur.xp;
  return {pct: Math.round(((xp-cur.xp)/span)*100), cur, nxt, need: nxt.xp - xp};
}

let _mid = 0;
function mascot(mood, size, cls){
  const m = MOODS[mood] || MOODS.neutro;
  const id = 'mg'+(++_mid);
  const s = size || 110;
  let g = '';

  /* olhos */
  const EY = 58, EL = 47, ER = 73;
  function eyePair(){
    const t = m.eyes;
    if(t==='happy'||t==='shut'){
      const d = t==='happy' ? 'M-9,3 Q0,-7 9,3' : 'M-9,-2 Q0,6 9,-2';
      return `<path d="${d}" transform="translate(${EL},${EY})" fill="none" stroke="#3b1f22" stroke-width="3.4" stroke-linecap="round"/>
              <path d="${d}" transform="translate(${ER},${EY})" fill="none" stroke="#3b1f22" stroke-width="3.4" stroke-linecap="round"/>`;
    }
    if(t==='closed'){
      return `<path d="M-8,0 Q0,5 8,0" transform="translate(${EL},${EY})" fill="none" stroke="#3b1f22" stroke-width="3.2" stroke-linecap="round"/>
              <path d="M-8,0 Q0,5 8,0" transform="translate(${ER},${EY})" fill="none" stroke="#3b1f22" stroke-width="3.2" stroke-linecap="round"/>`;
    }
    let rx=8.2, ry=9.4, pr=5, dx=0, dy=0, hl=2;
    if(t==='wide'){ rx=9.4; ry=10.8; pr=5.6 }
    if(t==='squint'){ ry=5.4; pr=4 }
    if(t==='side'){ dx=-2.6 }
    if(t==='up'){ dy=-2.4 }
    if(t==='sparkle'){ pr=5.8; hl=2.8 }
    function one(cx, extra){
      const r2 = (t==='uneven' && extra) ? ry*0.7 : ry;
      const p2 = (t==='uneven' && extra) ? pr*0.8 : pr;
      let peek = '';
      if(t==='peek' && extra===0) peek = `<path d="M${cx-9},${EY-2} Q${cx},${EY+9} ${cx+9},${EY-2} Z" fill="#f2a7ac"/>`;
      return `<ellipse cx="${cx}" cy="${EY}" rx="${rx}" ry="${r2}" fill="#fffaf7"/>
              <circle cx="${cx+dx}" cy="${EY+dy}" r="${p2}" fill="#3b1f22"/>
              <circle cx="${cx+dx-1.8}" cy="${EY+dy-2.4}" r="${hl}" fill="#fff"/>
              ${t==='sparkle'?`<circle cx="${cx+dx+2.4}" cy="${EY+dy+2.2}" r="1.3" fill="#fff"/>`:''}
              ${peek}`;
    }
    if(t==='peek'){
      return one(EL,0) + one(ER,0);
    }
    return one(EL,0) + one(ER,1);
  }

  /* sobrancelhas */
  function brows(){
    const t = m.brow, y = EY-13;
    const map = {
      flat:  ['M-7,0 L7,0','M-7,0 L7,0'],
      up:    ['M-7,2 Q0,-3 7,1','M-7,1 Q0,-3 7,2'],
      sad:   ['M-7,-2 Q0,1 7,3','M-7,3 Q0,1 7,-2'],
      strong:['M-8,1 L7,-2','M-7,-2 L8,1'],
      angry: ['M-8,-3 L7,2','M-7,2 L8,-3']
    };
    const d = map[t] || map.flat;
    return `<path d="${d[0]}" transform="translate(${EL},${y})" fill="none" stroke="#b9666d" stroke-width="2.6" stroke-linecap="round"/>
            <path d="${d[1]}" transform="translate(${ER},${y})" fill="none" stroke="#b9666d" stroke-width="2.6" stroke-linecap="round"/>`;
  }

  /* boca */
  function mouth(){
    const y = 76, t = m.mouth;
    const st = 'fill="none" stroke="#3b1f22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
    switch(t){
      case 'tiny':  return `<path d="M56,${y} Q60,${y+3.4} 64,${y}" ${st}/>`;
      case 'smile': return `<path d="M52,${y-1} Q60,${y+6} 68,${y-1}" ${st}/>`;
      case 'grin':  return `<path d="M50,${y-2} Q60,${y+8} 70,${y-2}" ${st}/>`;
      case 'smirk': return `<path d="M53,${y+1} Q60,${y+5} 68,${y-2}" ${st}/>`;
      case 'flat':  return `<path d="M55,${y} L65,${y}" ${st}/>`;
      case 'wavy':  return `<path d="M52,${y} q4,-4 8,0 q4,4 8,0" ${st}/>`;
      case 'frown': return `<path d="M53,${y+3} Q60,${y-3} 67,${y+3}" ${st}/>`;
      case 'o':     return `<ellipse cx="60" cy="${y+1}" rx="5" ry="6" fill="#3b1f22"/>`;
      case 'open':  return `<path d="M50,${y-3} Q60,${y+12} 70,${y-3} Z" fill="#3b1f22"/>
                            <path d="M55,${y+5} Q60,${y+10} 65,${y+5} Z" fill="#ff8f9c"/>`;
      default:      return `<path d="M55,${y} L65,${y}" ${st}/>`;
    }
  }

  /* extras */
  let extras = '';
  if(m.sweat) extras += `<path d="M96,40 q4,7 0,10 q-4,-3 0,-10 Z" fill="#8fd7ff" opacity=".95"/>`;
  if(m.tear)  extras += `<path d="M${ER+9},${EY+4} q3,7 0,10 q-3,-3 0,-10 Z" fill="#8fd7ff"/>`;
  if(m.mark==='?') extras += `<text x="99" y="30" font-family="Baloo 2,sans-serif" font-size="24" font-weight="800" fill="#d4767f">?</text>`;
  if(m.mark==='!') extras += `<text x="99" y="30" font-family="Baloo 2,sans-serif" font-size="24" font-weight="800" fill="#d4767f">!</text>`;
  if(m.mark==='z') extras += `<text x="92" y="28" font-family="Baloo 2,sans-serif" font-size="17" font-weight="800" fill="#c08d92">z</text><text x="103" y="18" font-family="Baloo 2,sans-serif" font-size="12" font-weight="800" fill="#c08d92">z</text>`;
  if(m.mark==='x') extras += `<path d="M94,22 l10,10 M104,22 l-10,10" stroke="#d4767f" stroke-width="3" stroke-linecap="round"/>`;
  if(m.crown)  extras += `<path d="M46,14 l6,9 6,-11 6,11 6,-9 -3,14 h-18 Z" fill="#ffd25e" transform="translate(0,-4)"/>`;
  if(m.spark){
    const sp = [[14,24],[104,52],[22,88]].slice(0, m.spark);
    sp.forEach(([x,y])=>{ extras += `<path d="M${x},${y-6} l1.9,4.1 4.1,1.9 -4.1,1.9 -1.9,4.1 -1.9,-4.1 -4.1,-1.9 4.1,-1.9 Z" fill="#ffd25e"/>` });
  }
  if(m.bubble) extras += `<g transform="translate(92,26)"><rect x="-2" y="-11" width="30" height="20" rx="10" fill="#fffaf7"/><circle cx="6" cy="-1" r="2.2" fill="#b9666d"/><circle cx="13" cy="-1" r="2.2" fill="#b9666d"/><circle cx="20" cy="-1" r="2.2" fill="#b9666d"/></g>`;

  /* braços e mãos */
  let limbs = '';
  if(m.arms){
    limbs += `<path d="M20,56 q-9,-9 -6,-17" stroke="#a34d53" stroke-width="7" stroke-linecap="round" fill="none"/>
              <path d="M100,56 q9,-9 6,-17" stroke="#a34d53" stroke-width="7" stroke-linecap="round" fill="none"/>`;
  }
  if(m.hands){
    limbs += `<circle cx="53" cy="86" r="7" fill="#c9686f"/><circle cx="67" cy="86" r="7" fill="#c9686f"/>`;
  } else if(m.hand){
    limbs += `<circle cx="70" cy="84" r="7" fill="#c9686f"/>`;
  }

  g = `
  <svg class="mascot ${cls||''}" width="${s}" height="${s}" viewBox="0 0 120 120" role="img" aria-label="Brainzy ${mood}">
    <defs>
      <radialGradient id="${id}" cx="40%" cy="32%" r="75%">
        <stop offset="0%" stop-color="#f8c3c6"/><stop offset="100%" stop-color="#eb9aa1"/>
      </radialGradient>
    </defs>
    <ellipse cx="60" cy="112" rx="27" ry="5" fill="#000" opacity=".22"/>
    <rect x="47" y="86" width="9" height="20" rx="4.5" fill="#a34d53"/>
    <rect x="64" y="86" width="9" height="20" rx="4.5" fill="#a34d53"/>
    <g fill="url(#${id})">
      <circle cx="38" cy="44" r="19"/><circle cx="60" cy="34" r="20"/><circle cx="82" cy="44" r="19"/>
      <circle cx="32" cy="63" r="18"/><circle cx="88" cy="63" r="18"/>
      <circle cx="46" cy="74" r="19"/><circle cx="74" cy="74" r="19"/><circle cx="60" cy="59" r="26"/>
    </g>
    <g fill="none" stroke="#d98289" stroke-width="3" stroke-linecap="round" opacity=".75">
      <path d="M60,17 c-4,9 4,13 0,21"/>
      <path d="M34,32 c-7,7 -6,15 0,20"/>
      <path d="M86,32 c7,7 6,15 0,20"/>

function seedDemo(name){
  S = blankState();

  S.xp = 0;
  const t = todayStr();
  const feels = ['nervoso','timido','tranquilo','feliz','confiante','pensativo','orgulhoso','ansioso','empolgado','neutro'];
  /* histórico dos últimos 12 dias */
  for(let i=11;i>=1;i--){
    const day = addDays(t, -i);
    S.days.push(day);
    let dayXp = 0;
    const n = 1 + (i % 3);
    for(let k=0;k<n;k++){
      const pool = [CARDS, CHALLENGES, MISSIONS][(i+k)%3];
      const item = pool[(i*37 + k*91) % pool.length];
      const type = ['card','challenge','mission'][(i+k)%3];
      const gain = Math.round(baseXp(type) * DIFFS[item.dif].mult);
      dayXp += gain; S.xp += gain;
      S.counters[type]++;
      if(item.dif===3) S.counters.hard++;
      if(type!=='card') S.done[type][item.id] = day;
      else S.cardSeen.push(item.id);
      addSkill(item.skill, item.dif, true);
      S.log.push({date:day, type, item:item.id, title:item.title, ctx:item.ctx, dif:item.dif,
                  feeling: feels[(i*3+k)%feels.length], result:'ok', xp:gain});
    }
    S.xpByDay[day] = dayXp;
  }

     situacao:'Puxei assunto com o pessoal da turma da tarde.',

/* ---------- XP, HABILIDADES, CONQUISTAS ---------- */
function baseXp(type){
  return {card:10, challenge:20, mission:15, event:25, diary:10, draw:5, streak:10}[type] || 5;
}
function addSkill(skill, dif, silent){
  const gain = 2 + dif;
  S.skills[skill] = Math.min(100, (S.skills[skill]||0) + gain);
  /* habilidade secundária ganha menos */
  const sec = {conv:'escu', escu:'conv', inic:'conf', conf:'inic', inter:'conv', expr:'conf'}[skill];
  if(sec) S.skills[sec] = Math.min(100, (S.skills[sec]||0) + 1);
}
function addXp(amount, label, ev){
  const before = levelOf(S.xp).n;
  S.xp += amount;
  const d = todayStr();
  S.xpByDay[d] = (S.xpByDay[d]||0) + amount;
  floatXp(amount, ev);
  toast(`+${amount} XP`, label || '', 'xp');
  const after = levelOf(S.xp).n;
  if(after > before) setTimeout(()=> levelUpModal(levelOf(S.xp)), 620);
  syncTop();
}

function touchDay(){
  const t = todayStr();
  if(S.lastDay === t) return false;
  const y = addDays(t, -1);
  if(S.lastDay === y) S.streak += 1;
  else S.streak = 1;
  S.lastDay = t;
  if(!S.days.includes(t)) S.days.push(t);
  S.best = Math.max(S.best, S.streak);
  S.xpByDay[t] = S.xpByDay[t] || 0;
  save();
  return true;
}
