
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12101a">
<meta name="description" content="Speak Up — pequenos passos, grandes conversas. Treine comunicação e habilidades sociais no seu ritmo.">
<title>Speak Up — Pequenos passos, grandes conversas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#12101a;--bg-deep:#0c0a12;--surface:#1b1826;--surface-2:#231f31;--surface-3:#2c2740;--line:#332d47;--line-soft:#2a2539;--txt:#f6f1f4;--txt-mid:#c3b8c9;--txt-dim:#8e8398;--rose:#f2a7ac;--rose-deep:#d4767f;--rose-ink:#a34d53;--green:#4ee39b;--blue:#5cb2ff;--purple:#b183ff;--yellow:#ffd25e;--orange:#ff9a5a;--red:#ff6b7a;--easy:var(--green);--mid:var(--yellow);--hard:var(--red);--disp:"Baloo 2",system-ui,sans-serif;--sans:"Nunito",system-ui,sans-serif;--r1:10px;--r2:16px;--r3:22px;--r4:30px;--sh:0 18px 44px #0004;--sh-s:0 8px 22px #0003;--base:15.5px;--sidebar:250px;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:var(--base);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 0%,#6d43a51a,transparent 36%),radial-gradient(ellipse at 0% 0%,#f2a7ac14,transparent 30%),var(--bg);background-attachment:fixed;color:var(--txt);font:500 1rem/1.55 var(--sans);overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:var(--rose)}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
::selection{background:var(--rose);color:var(--bg-deep)}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3,.display{font-family:var(--disp);line-height:1.12;letter-spacing:-.02em}
h1{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:.5rem}
h2{font-size:1.65rem;margin-bottom:.6rem}
h3{font-size:1.22rem;margin-bottom:.5rem}
p{color:var(--txt-mid)}
small,.muted{color:var(--txt-dim)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;z-index:2000;left:12px;top:12px;transform:translateY(-160%);background:var(--rose);color:#24151b;padding:12px 16px;border-radius:12px;font-weight:900}
.skip-link:focus{transform:translateY(0)}
.sidebar{position:fixed;z-index:80;inset:0 auto 0 0;width:var(--sidebar);display:flex;flex-direction:column;background:#15121f;border-right:1px solid var(--line-soft);padding:22px 14px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand-mark{width:48px;height:48px;display:grid;place-items:center;flex-shrink:0}
.brand-name{font:800 1.65rem/.95 var(--disp);letter-spacing:-.04em}
.brand-slogan{font-size:.72rem;color:var(--txt-dim);margin-top:5px;white-space:nowrap}
.side-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:var(--txt-dim);padding:12px 12px 7px}
.nav{display:grid;gap:4px}
.nav a,.nav button{appearance:none;text-align:left;color:var(--txt-mid);text-decoration:none;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;border:1px solid transparent;background:transparent;width:100%;font-size:.9rem;font-weight:800;transition:.18s ease}
.nav a:hover,.nav button:hover{background:var(--surface-2);color:var(--txt)}
.nav a.active{background:#f2a7ac18;border-color:#f2a7ac38;color:var(--rose)}
.nav .ni{width:22px;text-align:center;font-size:1.08rem}
.teacher-locked{display:none!important}
.sidebar-bottom{margin-top:auto;padding:16px 7px 2px}
.sidebar-note{font-size:.73rem;line-height:1.45;color:var(--txt-dim);display:flex;gap:8px;padding:12px 8px 5px}
.side-login{font-size:.82rem!important;justify-content:center;border-color:var(--line)!important;background:var(--surface)!important}
.scrim{display:none;position:fixed;inset:0;z-index:70;background:#05040bb8;backdrop-filter:blur(3px)}
.workspace{margin-left:var(--sidebar);min-height:100vh;min-width:0}
.topbar{height:82px;padding:16px clamp(16px,3vw,38px);display:flex;align-items:center;gap:10px;border-bottom:1px solid #332d473d;position:sticky;top:0;z-index:40;background:#12101adf;backdrop-filter:blur(18px)}
.hamburger{display:none}
.top-spacer{flex:1}
.stat-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--txt-mid);padding:8px 12px;border-radius:999px;font-weight:900;font-size:.82rem;white-space:nowrap}
.stat-pill strong{color:var(--txt);font-family:var(--disp);font-size:1.1rem}
.avatar-top{border:1px solid var(--line);background:var(--surface-2);color:var(--txt);border-radius:15px;width:44px;height:44px;font-size:1.4rem}
.page-wrap{max-width:1440px;margin:0 auto;padding:30px clamp(16px,3vw,38px) 96px}
#app{outline:none;min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{font-size:.74rem;color:var(--rose);text-transform:uppercase;letter-spacing:.13em;font-weight:900;margin-bottom:8px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span-2{grid-column:span 2}
.card{background:linear-gradient(145deg,#211d2d,#1b1826 75%);border:1px solid var(--line-soft);border-radius:var(--r3);padding:21px;box-shadow:var(--sh-s);min-width:0;animation:rise .35s ease both}
.card-lite{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r2);padding:16px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-head h2,.card-head h3{margin:0}
.section-title{margin:28px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.section-title h2{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:13px;padding:11px 16px;font-weight:900;text-decoration:none;transition:transform .18s,background .18s,border .18s;color:var(--txt);white-space:normal;line-height:1.2}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--rose);color:#2b171d;box-shadow:0 7px 20px #f2a7ac20}
.btn-primary:hover{background:#ffc0c3}
.btn-ghost{background:var(--surface-2);border-color:var(--line);color:var(--txt)}
.btn-green{background:var(--green);color:#102a20}
.btn-danger{background:#ff6b7a18;color:#ff9ca5;border-color:#ff6b7a50}
.btn-sm{font-size:.82rem;padding:8px 11px;border-radius:10px}
.btn-block{width:100%}
.btn:focus-visible,.tab:focus-visible{outline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:900;padding:5px 9px;border-radius:999px;background:var(--surface-3);color:var(--txt-mid);white-space:nowrap}
.chip.easy{color:var(--easy);background:#4ee39b17}
.chip.mid{color:var(--mid);background:#ffd25e18}
.chip.hard{color:var(--hard);background:#ff6b7a18}
.chip.rose{color:var(--rose);background:#f2a7ac16}
.chip.blue{color:var(--blue);background:#5cb2ff17}
.chip.purple{color:var(--purple);background:#b183ff17}
.chip.green{color:var(--green);background:#4ee39b17}
.chip.orange{color:var(--orange);background:#ff9a5a18}
.chip.yellow{color:var(--yellow);background:#ffd25e18}
.stat-card{display:flex;align-items:center;gap:14px;padding:18px}
.stat-icon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--surface-3);font-size:1.35rem;flex-shrink:0}
.stat-value{font:800 1.8rem/1 var(--disp);margin:5px 0 3px}
.stat-label{font-size:.81rem;color:var(--txt-dim);font-weight:800}
.progress{height:9px;border-radius:99px;background:#100e17;overflow:hidden}
.progress>span{height:100%;display:block;background:linear-gradient(90deg,var(--rose-deep),var(--rose));border-radius:99px;transition:width .4s}
.progress.green>span{background:linear-gradient(90deg,#2caf75,var(--green))}
.progress.blue>span{background:linear-gradient(90deg,#397cc4,var(--blue))}
.progress.purple>span{background:linear-gradient(90deg,#7e55c2,var(--purple))}
.progress.orange>span{background:linear-gradient(90deg,#c86b3e,var(--orange))}
.progress.yellow>span{background:linear-gradient(90deg,#b98c1e,var(--yellow))}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:900;font-size:.84rem;color:var(--txt-mid)}
.input{width:100%;border:1px solid var(--line);border-radius:12px;background:#13101c;color:var(--txt);padding:12px 13px;outline:none;min-width:0}
.input:focus{border-color:var(--rose);box-shadow:0 0 0 3px #f2a7ac20}
.input::placeholder{color:#81768a}
.input option{background:var(--surface)}
textarea.input{resize:vertical;min-height:100px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.tabs{display:flex;gap:6px;padding:5px;background:#100e17;border:1px solid var(--line-soft);border-radius:14px;width:max-content;max-width:100%;overflow:auto;margin-bottom:18px}
.tab{border:0;background:transparent;color:var(--txt-dim);padding:9px 14px;border-radius:10px;font-weight:900;white-space:nowrap}
.tab.active{background:var(--surface-3);color:var(--txt)}
.empty{text-align:center;padding:38px 20px}
.empty .empty-emoji{font-size:2.4rem;margin-bottom:10px}
.empty p{max-width:440px;margin:0 auto 14px}
.item-list{display:grid;gap:11px}
.activity{display:flex;align-items:flex-start;gap:14px;padding:17px;border:1px solid var(--line-soft);border-radius:17px;background:#211d2bbd;min-width:0}
.activity-body{flex:1;min-width:0}
.activity-title{font-weight:900;color:var(--txt);margin-bottom:4px}
.activity p{font-size:.88rem;margin:0 0 10px}
.activity-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.activity-action{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:105px}
.xp-label{color:var(--yellow);font:800 1rem var(--disp);white-space:nowrap}
.ctx-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ctx-btn{padding:13px 10px;background:var(--surface);color:var(--txt-mid);border:1px solid var(--line-soft);border-radius:15px;text-align:left;min-width:0;transition:.2s}
.ctx-btn:hover,.ctx-btn.active{border-color:var(--rose);background:#f2a7ac10;color:var(--txt)}
.ctx-emoji{font-size:1.4rem;display:block;margin-bottom:5px}
.ctx-name{font-weight:900;font-size:.84rem;display:block;overflow-wrap:anywhere}
.ctx-count{font-size:.72rem;color:var(--txt-dim)}
.sent-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.sent-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:13px;padding:10px 4px;color:var(--txt-mid);font-size:.75rem;font-weight:800}
.sent-btn span{display:block;font-size:1.35rem;margin-bottom:3px}
.sent-btn.active,.sent-btn:hover{border-color:var(--rose);background:#f2a7ac17;color:var(--txt)}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(190px,.6fr);overflow:hidden;padding:0;position:relative;min-height:260px}
.hero-copy{padding:30px;position:relative;z-index:1}
.hero h1{max-width:580px}
.hero p{max-width:590px}
.hero-mascot{display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle,#f2a7ac18,transparent 68%);min-height:220px}
.hero-mascot:after{content:"";width:180px;height:36px;position:absolute;bottom:33px;border-radius:50%;background:#08060d70;filter:blur(15px)}
.mascot-svg{width:100%;max-width:190px;height:auto;position:relative;z-index:1;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 12px 18px #0004)}
.hero-buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.quote{padding:11px 14px;border-left:3px solid var(--rose);background:#f2a7ac0d;border-radius:0 12px 12px 0;color:var(--txt-mid);font-weight:800;font-size:.91rem}
.skill-row{display:grid;grid-template-columns:115px minmax(80px,1fr) 42px;gap:12px;align-items:center;margin:15px 0}
.skill-name{font-size:.85rem;font-weight:900}
.skill-num{text-align:right;font:800 1rem var(--disp)}
.mini-bars{display:flex;align-items:flex-end;gap:9px;min-height:145px;padding:15px 0 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:145px;justify-content:flex-end;min-width:0}
.bar-value{font-size:.68rem;color:var(--txt-dim)}
.bar-track{height:105px;width:100%;max-width:37px;display:flex;align-items:flex-end;justify-content:center;background:#11101a;border-radius:10px;overflow:hidden}
.bar-fill{width:100%;min-height:3px;background:linear-gradient(180deg,var(--rose),var(--rose-deep));border-radius:8px 8px 3px 3px}
.bar-day{font-size:.71rem;color:var(--txt-dim)}
.streak-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.streak-day{padding:10px 2px;text-align:center;border-radius:13px;background:var(--surface-2);border:1px solid var(--line-soft);font-size:.76rem;color:var(--txt-dim)}
.streak-day strong{display:block;font:800 1.12rem var(--disp);color:var(--txt);margin:5px 0}
.streak-day.done{background:#4ee39b13;border-color:#4ee39b45;color:var(--green)}
.streak-day.today{border-color:var(--rose)}
.milestone{display:flex;align-items:center;gap:12px;padding:13px;border-bottom:1px solid var(--line-soft)}
.milestone:last-child{border-bottom:0}
.milestone-icon{width:42px;height:42px;display:grid;place-items:center;background:var(--surface-3);border-radius:14px;font-size:1.3rem}
.milestone-body{flex:1;min-width:0}
.milestone strong{display:block}
.milestone small{font-size:.76rem}
.ach-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ach{padding:17px 12px;text-align:center;background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;min-width:0}
.ach.locked{filter:grayscale(1);opacity:.48}
.ach-icon{font-size:2rem;display:block;margin-bottom:8px}
.ach strong{display:block;font-size:.9rem;margin-bottom:5px}
.ach p{font-size:.77rem;margin:0 0 6px}
.evt{position:relative;overflow:hidden}
.evt-date{display:inline-flex;align-items:center;gap:6px;color:var(--rose);font-size:.8rem;font-weight:900}
.evt-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--txt-dim);margin:12px 0}
.entry{padding:17px;border:1px solid var(--line-soft);border-radius:16px;background:var(--surface);margin-bottom:10px}
.entry-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.entry p{margin:9px 0 0;white-space:pre-wrap}
.fav-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.fav-row:last-child{border:0}
.fdist-row{display:grid;grid-template-columns:26px 85px 1fr 25px;gap:8px;align-items:center;margin:10px 0;font-size:.81rem}
.teacher-table-wrap{overflow:auto;border:1px solid var(--line-soft);border-radius:15px}
table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:650px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
th{font-size:.72rem;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.06em;background:#171421;position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.student-cell{display:flex;align-items:center;gap:9px;font-weight:900}
.student-avatar{width:34px;height:34px;display:grid;place-items:center;background:var(--surface-3);border-radius:11px;font-size:1.12rem}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}
.status-dot.off{background:var(--txt-dim)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.switch-row:last-child{border-bottom:0}
.switch-copy{flex:1}
.switch-copy strong{display:block}
.switch-copy small{display:block}
.switch{width:48px;height:27px;border-radius:99px;background:#454052;border:1px solid #595168;position:relative;padding:0;flex-shrink:0}
.switch:after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;background:white;border-radius:50%;transition:transform .2s}
.switch[aria-pressed="true"]{background:#2f9d6b;border-color:#4ee39b}
.switch[aria-pressed="true"]:after{transform:translateX(21px)}
.toast-region{position:fixed;right:20px;top:94px;z-index:200;display:grid;gap:9px;width:min(350px,calc(100vw - 30px));pointer-events:none}
.toast{display:flex;gap:12px;background:#252033;border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:var(--sh);animation:toastIn .25s ease both;pointer-events:auto}
.toast-icon{font-size:1.3rem}
.toast strong{display:block;font-size:.9rem}
.toast p{font-size:.79rem;margin:2px 0 0}
.toast.out{animation:toastOut .25s ease both}
.floating-xp{position:fixed;z-index:250;pointer-events:none;color:var(--yellow);font:900 1.7rem var(--disp);text-shadow:0 4px 18px #000;animation:xpUp 1.2s ease-out forwards}
.confetti-piece{position:fixed;z-index:260;top:-18px;width:8px;height:12px;pointer-events:none;animation:fall 2.5s linear forwards}
.modal-layer{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:16px;background:#08060dc9;backdrop-filter:blur(7px);animation:fade .18s ease}
.modal{width:min(570px,100%);max-height:min(88vh,850px);overflow:auto;border-radius:25px;border:1px solid #4a405f;background:linear-gradient(145deg,#252033,#191623);box-shadow:var(--sh);padding:26px;animation:rise .25s ease}
.modal.wide{width:min(820px,100%)}
.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}
.modal-close{background:var(--surface-3);color:var(--txt);border:1px solid var(--line);border-radius:11px;width:38px;height:38px;font-size:1.1rem;flex-shrink:0}
.modal-mascot{width:100px;margin:0 auto 10px;display:block}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.feel-pick{border:1px solid var(--line);background:var(--surface-2);color:var(--txt-mid);border-radius:13px;padding:10px 5px;font-size:.76rem;font-weight:900}
.feel-pick span{display:block;font-size:1.45rem;margin-bottom:3px}
.feel-pick.active{border-color:var(--rose);background:#f2a7ac17;color:var(--txt)}
.feel-modal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mobile-nav{display:none}
.a11y-fab{position:fixed;right:20px;bottom:20px;z-index:100;width:54px;height:54px;border-radius:18px;background:var(--purple);color:#21162e;border:2px solid #fff4;box-shadow:var(--sh);font-size:1.55rem;font-weight:900}
.a11y-panel{position:fixed;right:18px;bottom:87px;z-index:140;width:min(390px,calc(100vw - 28px));max-height:75vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:20px}
.a11y-panel[hidden]{display:none}
.a11y-panel h2{font-size:1.4rem}
.a11y-options{display:grid;gap:11px}
.a11y-option{display:flex;gap:12px;align-items:center;justify-content:space-between}
.a11y-option strong{font-size:.86rem}
.a11y-option small{display:block;font-size:.72rem}
.a11y-size{display:flex;gap:6px}
.a11y-size .btn{min-width:39px;padding:8px}
.a11y-live{position:absolute;left:-9999px}
.teacher-lock{text-align:center;padding:45px 20px}
.teacher-lock .lock-icon{font-size:3rem}
.teacher-lock p{max-width:480px;margin:0 auto 18px}
.mood-face{font-size:2.1rem}
.quick-contexts{display:flex;gap:8px;flex-wrap:wrap}
.context-chip{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--txt-mid);background:var(--surface);font-size:.83rem;font-weight:900}
.context-chip:hover{border-color:var(--rose);color:var(--rose)}
.line-divider{height:1px;background:var(--line-soft);margin:18px 0}
.tip{font-size:.85rem;color:var(--txt-mid);padding:12px 14px;border-radius:13px;background:#ffd25e0b;border:1px solid #ffd25e26}

function buildLibrary(type){const pool=[];CONTEXTOS.forEach(([id,emoji,nome])=>DIFS.forEach(d=>{PROMPTS[type].forEach((p,pi)=>{let skill=HABILIDADES[(HABILIDADES.findIndex(h=>h[0]===(SKILL_BY_CONTEXT[id]||'conv'))+pi)%HABILIDADES.length][0];let tx=p[0],tip=p[1],title='';if(type==='carta'){const variants=[`Você está em ${nome.toLowerCase()}. ${tx}`,`Imagine uma situação de ${nome.toLowerCase()}: ${tx.toLowerCase()}`,`Em um momento ligado a ${nome.toLowerCase()}, ${tx.charAt(0).toLowerCase()+tx.slice(1)}`,`${tx} Pense em uma situação de ${nome.toLowerCase()}.`,`Durante uma conversa sobre ${nome.toLowerCase()}, ${tx.charAt(0).toLowerCase()+tx.slice(1)}`];tx=variants[pi]}else{title=`${p[0]} — ${nome}`;tx=`${p[1]} Contexto: ${nome.toLowerCase()}.`;if(d.id===2)tx+=' Tente incluir uma pergunta de acompanhamento ou uma explicação breve.';if(d.id===3)tx+=' Escolha uma situação realista, adapte a ação ao seu conforto e reflita sobre o resultado.';tip=d.id===1?'Comece de um jeito simples; vale adaptar a atividade ao seu momento.':d.id===2?'Dê um passo além do habitual, sem exigir perfeição.':'Prepare uma frase inicial e respeite seus limites e os da outra pessoa.'}if(type==='carta'&&d.id>1)tip=d.id===2?'Experimente fazer uma pergunta de acompanhamento.':'Tente conectar a pergunta a uma experiência ou opinião sua.';pool.push({...parseLib([id,d.id,skill,tx,tip].join('|')),tipo:type,titulo:title})})}));return pool}

function todayStr(){return new Date().toLocaleDateString('en-CA')}
function addDays(n,from=todayStr()){const d=new Date(from+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')}
function fmtDate(s,opts={day:'2-digit',month:'2-digit',year:'numeric'}){try{return new Date(s+'T12:00:00').toLocaleDateString('pt-BR',opts)}catch{return s||'—'}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}
function seededPick(pool,seed,n=1){if(!pool.length)return[];let x=hashStr(String(seed)),a=pool.slice(),out=[];for(let i=a.length-1;i>0;i--){x=(Math.imul(1664525,x)+1013904223)>>>0;let j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}for(let i=0;i<Math.min(n,a.length);i++)out.push(a[i]);return out}
function weekKey(){const d=new Date(todayStr()+'T12:00:00'),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toLocaleDateString('en-CA')}
function activityTotal(s){return s.counters.challenge+s.counters.mission+s.counters.card+s.counters.event}
function levelOf(xp){let cur=LEVELS[0];LEVELS.forEach(l=>{if(xp>=l.xp)cur=l});return cur}
function nextLevel(xp){return LEVELS.find(l=>l.xp>xp)||null}
function levelProgress(xp){let c=levelOf(xp),n=nextLevel(xp);return n?Math.max(0,Math.min(100,(xp-c.xp)/(n.xp-c.xp)*100)):100}
function ctx(id){return CONTEXTOS.find(c=>c[0]===id)||CONTEXTOS[0]}
function skill(id){return HABILIDADES.find(h=>h[0]===id)||HABILIDADES[0]}
function difficulty(id){return DIFS.find(d=>d.id===+id)||DIFS[0]}
function firstName(){return (S.name||'Estudante').trim().split(/\s+/)[0]||'Estudante'}
function blankState(){return{name:'',avatar:'🙂',created:todayStr(),xp:0,streak:0,best:0,lastDay:'',days:[],xpByDay:{},done:{challenge:{},mission:{}},cardSeen:[],favorites:[],cardsUsed:0,cardDraws:{},diary:[],events:{},achievements:[],log:[],skills:{conv:0,inter:0,inic:0,conf:0,escu:0,expr:0},counters:{challenge:0,mission:0,card:0,event:0,diary:0,hard:0},custom:{challenge:[],mission:[],event:[]},settings:{notif:true,reminder:true,sound:true,onboarded:false},ui:{}}}
let S=blankState(),teacherLoggedIn=false,routeNow='inicio',modalReturnFocus=null,pendingActivity=null,selectedMood='neutro',cardContext='novas',currentCard=null,challengeTab='Hoje',challengeContext='todos',missionTab='Hoje',teacherStudent=null,a11y={scale:0,contrast:false,dyslexia:false,spacing:false,links:false,motion:false,focus:false,cursor:false,voice:false,vlibras:false};
function safeGet(key){try{return localStorage.getItem(key)}catch(e){return null}}
function safeSet(key,val){try{localStorage.setItem(key,val);return true}catch(e){return false}}
function save(){try{safeSet('speakup.v1',JSON.stringify(S))}catch(e){console.warn('Não foi possível salvar os dados locais.',e)}}
function load(){try{let raw=safeGet('speakup.v1');if(!raw)return blankState();let data=JSON.parse(raw),base=blankState();return {...base,...data,done:{...base.done,...data.done},skills:{...base.skills,...data.skills},counters:{...base.counters,...data.counters},settings:{...base.settings,...data.settings},custom:{...base.custom,...data.custom},ui:{...base.ui,...data.ui}}}catch(e){return blankState()}}
function toast(title,sub='',type='info'){const host=document.getElementById('toasts');const icons={success:'✅',xp:'⭐',achievement:'🏆',error:'⚠️',info:'💬'};const el=document.createElement('div');el.className='toast';el.innerHTML=`<div class="toast-icon">${icons[type]||icons.info}</div><div><strong>${esc(title)}</strong><p>${esc(sub)}</p></div>`;host.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)},3600)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function confetti(){if(!S.settings.sound)return;const colors=['#f2a7ac','#ffd25e','#4ee39b','#5cb2ff','#b183ff','#ff9a5a'];for(let i=0;i<44;i++){const e=document.createElement('i');e.className='confetti-piece';e.style.left=Math.random()*100+'vw';e.style.background=colors[i%colors.length];e.style.animationDelay=Math.random()*.8+'s';e.style.transform=`rotate(${Math.random()*360}deg)`;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}}
function floatXp(val,el){const b=document.createElement('div');b.className='floating-xp';b.textContent=`+${val} XP`;const r=(el||document.querySelector('.topbar')).getBoundingClientRect();b.style.left=Math.max(50,Math.min(innerWidth-50,r.left+r.width/2))+'px';b.style.top=Math.max(80,r.top+10)+'px';document.body.appendChild(b);setTimeout(()=>b.remove(),1300)}
function openModal(html,opts={}){modalReturnFocus=document.activeElement;const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-layer" data-act="modal-backdrop"><section class="modal ${opts.wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"><div class="modal-head"><div>${opts.eyebrow?`<div class="eyebrow">${opts.eyebrow}</div>`:''}<h2 id="modalTitle">${opts.title||'Speak Up'}</h2></div><button class="modal-close" data-act="modal-close" aria-label="Fechar janela">×</button></div>${html}</section></div>`;const dlg=root.querySelector('[role=dialog]');dlg.focus();const f=dlg.querySelector('input,button,select,textarea,[tabindex="0"]');if(f)setTimeout(()=>f.focus(),40)}
function closeModal(){document.getElementById('modalRoot').innerHTML='';if(modalReturnFocus&&modalReturnFocus.isConnected)modalReturnFocus.focus();modalReturnFocus=null}
function addSkill(id,amount){if(!S.skills[id])S.skills[id]=0;S.skills[id]=Math.min(100,S.skills[id]+amount)}
function addXp(value,label='Atividade',eventEl=null){const before=levelOf(S.xp).n;S.xp+=Math.max(0,Math.round(value));S.xpByDay[todayStr()]=(S.xpByDay[todayStr()]||0)+Math.max(0,Math.round(value));save();updateTop();floatXp(Math.round(value),eventEl);const after=levelOf(S.xp).n;if(after>before)showLevelUp(after,label);return Math.round(value)}
function touchDay(){const today=todayStr(),yesterday=addDays(-1);if(S.lastDay!==today){if(S.lastDay===yesterday)S.streak+=1;else S.streak=1;S.lastDay=today;S.days=[...new Set([...(S.days||[]),today])].sort();S.best=Math.max(S.best,S.streak);const m=MILESTONES.find(x=>x[0]===S.streak);if(m){S.xp+=m[1];S.xpByDay[today]=(S.xpByDay[today]||0)+m[1];toast(`Marco de ${m[0]} dias!`,`Bônus de sequência: +${m[1]} XP.`,'xp')}}save()}
function checkAchievements(){let changed=false;ACHIEVEMENTS.forEach((a,i)=>{if(!S.achievements.some(x=>x.id===i)&&a[3](S)){S.achievements.push({id:i,date:todayStr()});changed=true;toast(`Conquista desbloqueada: ${a[1]}`,a[2],'achievement')}});if(changed){save();if(S.settings.sound)confetti()}}
function showLevelUp(n,label){const l=LEVELS.find(x=>x.n===n)||LEVELS[LEVELS.length-1];const lines={2:'Você está criando coragem, uma conversa de cada vez.',3:'Suas ideias estão encontrando mais espaço.',4:'Você está construindo conexões verdadeiras.',5:'Sua confiança cresce com a prática.',6:'Escuta, presença e iniciativa: seu repertório está aumentando.',7:'Sua voz pode incentivar outras pessoas.',8:'Você chegou longe, respeitando seu próprio ritmo.'};setTimeout(()=>{openModal(`<div style="text-align:center">${mascot('comemorando',135)}<p>${esc(lines[n]||'Cada pequeno passo conta.')}</p><div class="chip rose">Nível ${n}</div><h2 style="margin-top:12px">${esc(l.name)}</h2><p>Continue praticando no seu ritmo. O progresso é seu!</p><div class="modal-actions" style="justify-content:center"><button class="btn btn-primary" data-act="modal-close">Continuar</button></div></div>`,{title:'Você subiu de nível!',eyebrow:'Nova etapa desbloqueada'})},100)}
function actLog(type,item,sent,earned){S.log.unshift({type,contexto:item.contexto||item.id||'cotidiano',sentimento:sent,data:todayStr(),xp:earned,title:item.titulo||item.texto||item.title||item.nome||'Atividade'});S.log=S.log.slice(0,500)}
function dailyChallenges(){const all=[...LIB.challenge,...S.custom.challenge.map(x=>({...x,custom:true}))];return seededPick(all,todayStr()+'challenges',3)}

function cardKey(c){return [c.contexto,c.dificuldade,c.texto].join('~')}
function drawCard(id=cardContext){cardContext=id;const pool=LIB.card.filter(c=>c.contexto===id);let unseen=pool.filter(c=>!S.cardSeen.includes(cardKey(c)));if(!unseen.length){S.cardSeen=S.cardSeen.filter(k=>!pool.some(c=>cardKey(c)===k));unseen=pool.slice()}currentCard=seededPick(unseen,todayStr()+Math.random().toString(16).slice(2,8),1)[0]||pool[0];S.cardSeen.push(cardKey(currentCard));S.cardSeen=S.cardSeen.slice(-150);S.cardDraws[id]=(S.cardDraws[id]||0)+1;save()}
function getEvents(){const seeds=EVT_SEED.map((e,i)=>({id:'seed-'+i,emoji:e[0],titulo:e[1],data:addDays(e[2]),hora:e[3],local:e[4],descricao:e[5],participantes:12+(i*7)%39,seed:true}));return [...seeds,...S.custom.event.map(e=>({...e,seed:false,participantes:e.participantes||0}))].sort((a,b)=>a.data.localeCompare(b.data))}

function challengeCard(c,type='challenge'){const diff=difficulty(c.dificuldade),ct=ctx(c.contexto),sk=skill(c.habilidade),id=itemId(c,type),done=type==='challenge'?!!S.done.challenge[id]:!!S.done.mission[id],xp=Math.round((type==='challenge'?25:type==='mission'?15:5)*diff.mult);return `<article class="activity"><div class="stat-icon">${ct[1]}</div><div class="activity-body"><div class="activity-title">${esc(c.titulo||c.texto||'Pequena prática')}</div><p>${esc(c.descricao||c.texto||'')}</p><div class="activity-meta"><span class="chip ${diff.cls}">${diff.emoji} ${diff.nome}</span><span class="chip ${sk[3]}">${sk[1]} ${sk[2]}</span><span class="chip">${ct[1]} ${ct[2]}</span>${c.custom?'<span class="chip purple">Da escola</span>':''}</div></div><div class="activity-action"><span class="xp-label">+${xp} XP</span>${done?`<button class="btn btn-ghost btn-sm" disabled>✅ Concluído ${fmtDate(S.done[type][id])}</button>`:`<button class="btn btn-primary btn-sm" data-act="start-activity" data-type="${type}" data-id="${esc(id)}">Concluir</button>`}</div></article>`}

function startActivity(type,id){const item=findItem(type,id);if(!item){toast('Atividade indisponível','Atualize a tela e tente novamente.','error');return}pendingActivity={type,id,item};selectedMood='neutro';openModal(`<div style="text-align:center">${mascot('curioso',92)}<p>Não existe sentimento certo ou errado. Como você se sente ao pensar nessa atividade?</p></div><div class="feel-modal-grid" id="feelPicker">${SENTIMENTOS.map(s=>`<button class="feel-pick ${s[0]===selectedMood?'active':''}" data-act="pick-feeling" data-mood="${s[0]}"><span>${s[1]}</span>${s[2]}</button>`).join('')}</div><div class="tip" style="margin-top:14px">Você pode adaptar qualquer desafio ao seu conforto. O importante é praticar com respeito a si e às outras pessoas.</div><div class="modal-actions"><button class="btn btn-ghost" data-act="modal-close">Agora não</button><button class="btn btn-primary" data-act="confirm-activity">Registrar prática</button></div>`,{title:'Como você se sentiu?',eyebrow:'Uma pausa para perceber'})}
function finishActivity(){if(!pendingActivity)return;const {type,item}=pendingActivity,sent=selectedMood,{xp,diff}=studentActivity(type,item);if(type==='challenge'){S.done.challenge[itemId(item,type)]=todayStr();S.counters.challenge++}else if(type==='mission'){S.done.mission[itemId(item,type)]=todayStr();S.counters.mission++}else{S.counters.card++;S.cardsUsed++}if(diff.id===3)S.counters.hard++;addSkill(item.habilidade||'conv',diff.id===1?1.5:diff.id===2?2.5:4);touchDay();actLog(type,item,sent,xp);const gained=addXp(xp,type);checkAchievements();save();pendingActivity=null;closeModal();render();setTimeout(()=>openModal(`<div style="text-align:center">${mascot('comemorando',118)}<div class="chip green">+${gained} XP</div><h2 style="margin-top:10px">Você deu mais um passo!</h2><p>${feedbackFor(sent)} Sua prática conta, mesmo quando a experiência parece pequena.</p><div class="quote" style="text-align:left">“${esc(item.titulo||item.texto||'Sua prática de hoje')}”</div><div class="modal-actions" style="justify-content:center"><button class="btn btn-primary" data-act="modal-close">Continuar</button></div></div>`,{title:'Prática registrada',eyebrow:'Muito bem'}),60)}
function feedbackFor(sent){const f={timido:'Coragem não é não sentir timidez; é escolher um passo possível.',nervoso:'Respirar e tentar já é uma forma de coragem.',ansioso:'Você não precisa ter todas as respostas antes de começar.',pensativo:'Refletir sobre a experiência ajuda você a aprender.',neutro:'A prática também acontece nos dias comuns.',tranquilo:'Que bom que você encontrou um ritmo confortável.',feliz:'Leve essa energia boa para a próxima conversa.',confiante:'Use sua confiança também para abrir espaço aos outros.',orgulhoso:'Reconheça o esforço que trouxe você até aqui.',empolgado:'Transforme essa energia em curiosidade e escuta.',frustrado:'Nem toda tentativa sai como imaginamos; ela ainda ensina.',cansado:'Respeitar seu ritmo também faz parte do progresso.'};return f[sent]||'Cada pequeno passo conta.'}
function feelingPicker(action='save-diary'){return `<div class="sent-grid">${SENTIMENTOS.map(s=>`<button class="sent-btn ${selectedMood===s[0]?'active':''}" data-act="${action==='save-diary'?'diary-mood':'quick-mood'}" data-mood="${s[0]}"><span>${s[1]}</span>${s[2]}</button>`).join('')}</div>`}
function inicio(){const lev=levelOf(S.xp),next=nextLevel(S.xp),daily=dailyChallenges()[0],missions=dailyMissions(),mDone=missions.filter(m=>S.done.mission[itemId(m,'mission')]).length,rec=LIB.card.find(c=>c.contexto===cardContext)||LIB.card[0],mood=lastMood()||((S.xp>0)?'sorrindo':'curioso');return `${head('SEU ESPAÇO DE PRÁTICA',`Olá, <span class="greeting">${esc(firstName())}</span>!`,'Um passo de cada vez. Você não precisa ser perfeito para se conectar com alguém.')}<section class="card hero"><div class="hero-copy"><div class="eyebrow">Pequenos passos, grandes conversas</div><h1>Oi, ${esc(firstName())}! Vamos praticar no seu ritmo?</h1><p>${brainPhrase(mood)}</p><div class="hero-buttons"><button class="btn btn-primary" data-act="route" data-route="desafios">🎯 Explorar desafios</button><button class="btn btn-ghost" data-act="route" data-route="cartas">💬 Tirar uma carta</button></div></div><div class="hero-mascot">${mascot(mood,185)}</div></section>
<div class="grid cols-4" style="margin-top:17px">${statCard('🔥',S.streak,'dias de sequência',`Recorde: ${S.best} dias`)}${statCard('⭐',S.xp,'XP acumulados',`+${S.xpByDay[todayStr()]||0} hoje`)}${statCard('🏅',lev.n,lev.name,`${Math.round(levelProgress(S.xp))}% do nível`)}${statCard('✨',activityTotal(S),'atividades feitas',`${S.counters.challenge} desafios concluídos`)}</div>
<div class="grid cols-2" style="margin-top:17px"><section class="card"><div class="card-head"><div><div class="eyebrow">Próxima conquista pessoal</div><h2>${next?`Faltam ${next.xp-S.xp} XP`:'Nível máximo alcançado!'}</h2></div><span class="chip rose">Nível ${lev.n}</span></div><p>${next?`Continue praticando para chegar a <strong>${next.name}</strong>.`:'Você chegou ao último nível disponível. Continue cultivando suas habilidades.'}</p><div class="progress"><span style="width:${levelProgress(S.xp)}%"></span></div><div style="display:flex;justify-content:space-between;margin-top:8px"><small>${lev.xp} XP</small><small>${next?next.xp+' XP':'100%'}</small></div></section><section class="card"><div class="card-head"><div><div class="eyebrow">Desafio do dia</div><h2>Uma oportunidade gentil</h2></div><span style="font-size:1.5rem">🎯</span></div><div class="activity-title">${esc(daily.titulo)}</div><p>${esc(daily.descricao)}</p><div class="activity-meta"><span class="chip ${difficulty(daily.dificuldade).cls}">${difficulty(daily.dificuldade).emoji} ${difficulty(daily.dificuldade).nome}</span><span class="xp-label">+${studentActivity('challenge',daily).xp} XP</span></div><button class="btn btn-primary btn-sm" style="margin-top:14px" data-act="start-activity" data-type="challenge" data-id="${esc(itemId(daily,'challenge'))}" ${S.done.challenge[itemId(daily,'challenge')]?'disabled':''}>${S.done.challenge[itemId(daily,'challenge')]?'✅ Já concluído':'Vamos tentar'}</button></section></div>
<div class="section-title"><h2>Missões do dia</h2><span class="chip">${mDone} de ${missions.length} concluídas</span></div><div class="card"><div class="progress green"><span style="width:${missions.length?mDone/missions.length*100:0}%"></span></div><div class="item-list" style="margin-top:14px">${missions.map(m=>miniTask(m,'mission')).join('')}</div><button class="btn btn-ghost btn-sm" style="margin-top:14px" data-act="route" data-route="missoes">Ver todas as missões →</button></div>
<div class="section-title"><h2>Uma carta para começar</h2><button class="btn btn-ghost btn-sm" data-act="route" data-route="cartas">Biblioteca completa →</button></div><section class="card"><div class="activity"><div class="stat-icon">${ctx(rec.contexto)[1]}</div><div class="activity-body"><div class="activity-meta"><span class="chip rose">${ctx(rec.contexto)[2]}</span><span class="chip ${difficulty(rec.dificuldade).cls}">${difficulty(rec.dificuldade).nome}</span></div><h3 style="margin-top:10px">${esc(rec.texto)}</h3><p>💡 ${esc(rec.dica)}</p><button class="btn btn-primary btn-sm" data-act="card-context" data-context="${rec.contexto}">Explorar cartas</button></div></div></section>
<div class="section-title"><h2>Como você está se sentindo?</h2><span class="muted">Check-in rápido</span></div><section class="card"><p>Nomear uma emoção já é um jeito de cuidar de você.</p>${feelingPicker('quick-mood')}<div id="quickMoodMessage" style="margin-top:10px"></div></section>
<div class="section-title"><h2>Escolha um contexto</h2><button class="btn btn-ghost btn-sm" data-act="route" data-route="cartas">Ver os 27 →</button></div><div class="quick-contexts">${CONTEXTOS.slice(0,9).map(c=>`<button class="context-chip" data-act="card-context" data-context="${c[0]}">${c[1]} ${c[2]}</button>`).join('')}</div>`}
function brainPhrase(m){const arr={timido:'Você pode começar com um oi. Pequenos começos também são progresso.',nervoso:'Respire com calma. Você não precisa encontrar a frase perfeita.',ansioso:'Vamos por partes: curiosidade, escuta e um pequeno passo.',pensativo:'Pensar antes de falar também faz parte da sua maneira de se comunicar.',neutro:'Conversas são habilidades que crescem com a prática.',calmo:'Seu ritmo é válido. Uma conversa de cada vez.',feliz:'Compartilhe um pouco dessa energia e mantenha espaço para escutar.',confiante:'Você pode usar sua voz e também convidar outras vozes.',orgulhoso:'Olhe para o caminho que você já percorreu.',empolgado:'Vamos transformar curiosidade em conexão.'};return arr[m]||'Você não precisa mudar quem é para construir boas conversas.'}
function lastMood(){const l=S.log[0]?.sentimento||S.diary[0]?.sentimento;return SENTIMENTOS.find(s=>s[0]===l)?.[3]||''}
function miniTask(m,type){const id=itemId(m,type),done=!!S.done[type][id],ct=ctx(m.contexto);return `<div class="fav-row"><div class="stat-icon" style="width:39px;height:39px">${ct[1]}</div><div style="flex:1;min-width:0"><strong>${esc(m.titulo)}</strong><div class="muted" style="font-size:.78rem">${esc(m.descricao)}</div></div><button class="btn ${done?'btn-ghost':'btn-primary'} btn-sm" data-act="start-activity" data-type="${type}" data-id="${esc(id)}" ${done?'disabled':''}>${done?'✓ Feita':'Fazer'}</button></div>`}
function desafios(){let pool=[...LIB.challenge,...S.custom.challenge.map(x=>({...x,custom:true}))];if(challengeTab==='Hoje')pool=dailyChallenges();else if(challengeTab==='Semana')pool=seededPick(pool,weekKey()+'challengeweek',18);if(challengeContext!=='todos')pool=pool.filter(c=>c.contexto===challengeContext);return `${head('PRATIQUE NA VIDA REAL','Desafios','Experimente ações pequenas para treinar sua iniciativa, escuta e confiança.',`<button class="btn btn-ghost btn-sm" data-act="set-challenge-tab" data-tab="Todos">Ver biblioteca completa</button>`)}<div class="tabs">${['Hoje','Semana','Todos'].map(t=>`<button class="tab ${challengeTab===t?'active':''}" data-act="set-challenge-tab" data-tab="${t}">${t}</button>`).join('')}</div><div class="card-lite" style="margin-bottom:16px"><div class="field"><label for="challengeContext">Filtrar por contexto</label><select class="input" id="challengeContext" data-act="context-filter" data-filter="challenge"><option value="todos">Todos os contextos</option>${CONTEXTOS.map(c=>`<option value="${c[0]}" ${challengeContext===c[0]?'selected':''}>${c[1]} ${c[2]}</option>`).join('')}</select></div><small style="display:block;margin-top:8px">${pool.length} práticas disponíveis nesta seleção. Concluir uma atividade registra seu sentimento e soma experiência.</small></div><div class="item-list">${pool.length?pool.map(c=>challengeCard(c,'challenge')).join(''):`<div class="card empty"><div class="empty-emoji">🔎</div><h3>Nenhum desafio neste filtro</h3><p>Experimente outro contexto para descobrir uma nova prática.</p></div>`}</div>`}
function missoes(){let pool=missionTab==='Hoje'?dailyMissions():[...LIB.mission,...S.custom.mission.map(x=>({...x,custom:true}))];const done=pool.filter(m=>S.done.mission[itemId(m,'mission')]).length;return `${head('PASSOS PEQUENOS','Missões','Pequenas ações que cabem no seu dia. Adapte cada proposta à sua realidade.')}<div class="card" style="margin-bottom:17px"><div class="card-head"><h2>Seu progresso</h2><span class="chip green">${done}/${pool.length} concluídas</span></div><div class="progress green"><span style="width:${pool.length?done/pool.length*100:0}%"></span></div><p style="margin:10px 0 0;font-size:.84rem">Não é uma corrida. Escolha uma missão que faça sentido para você.</p></div><div class="tabs"><button class="tab ${missionTab==='Hoje'?'active':''}" data-act="set-mission-tab" data-tab="Hoje">Missões de hoje</button><button class="tab ${missionTab==='Todas'?'active':''}" data-act="set-mission-tab" data-tab="Todas">Todas as missões</button></div><div class="item-list">${pool.map(m=>challengeCard(m,'mission')).join('')}</div>`}
function cartas(){const active=cardContext,c=currentCard||LIB.card.find(x=>x.contexto===active)||LIB.card[0],ct=ctx(active),favorites=LIB.card.filter(x=>S.favorites.includes(cardKey(x))),recent=S.log.filter(x=>x.type==='card').slice(0,5);return `${head('PERGUNTAS QUE APROXIMAM','Cartas de conversa','Use as cartas como inspiração. Você pode pensar na resposta, escrever ou praticar com alguém de confiança.')}<div class="ctx-grid" style="margin-bottom:22px">${CONTEXTOS.map(c=>`<button class="ctx-btn ${active===c[0]?'active':''}" data-act="card-context" data-context="${c[0]}"><span class="ctx-emoji">${c[1]}</span><span class="ctx-name">${c[2]}</span><span class="ctx-count">${LIB.card.filter(x=>x.contexto===c[0]).length} cartas</span></button>`).join('')}</div><div class="grid cols-2"><section class="card"><div class="card-head"><span class="chip rose">${ct[1]} ${ct[2]}</span><span class="chip ${difficulty(c.dificuldade).cls}">${difficulty(c.dificuldade).emoji} ${difficulty(c.dificuldade).nome}</span></div><div style="text-align:center;padding:12px 5px 20px">${mascot('curioso',90)}<div class="eyebrow" style="margin-top:8px">Carta de conversa</div><h2>${esc(c.texto)}</h2><div class="tip" style="text-align:left;margin-top:15px">💡 <strong>Dica:</strong> ${esc(c.dica)}</div></div><div class="activity-meta"><span class="chip ${skill(c.habilidade)[3]}">${skill(c.habilidade)[1]} ${skill(c.habilidade)[2]}</span><span class="xp-label">+${studentActivity('card',c).xp} XP</span></div><div class="grid cols-2" style="margin-top:16px"><button class="btn btn-primary" data-act="start-activity" data-type="card" data-id="${esc(itemId(c,'card'))}">💬 Praticar</button><button class="btn btn-ghost" data-act="favorite-card" data-key="${esc(cardKey(c))}">${S.favorites.includes(cardKey(c))?'⭐ Favoritada':'☆ Favoritar'}</button><button class="btn btn-ghost" data-act="draw-card">↻ Nova carta</button><button class="btn btn-ghost" data-act="draw-card">Pular →</button></div></section><section class="card"><div class="card-head"><h2>Suas favoritas</h2><span class="chip">${favorites.length}</span></div>${favorites.length?favorites.slice(0,8).map(f=>`<div class="fav-row"><span>${ctx(f.contexto)[1]}</span><div style="flex:1;min-width:0"><strong style="font-size:.86rem">${esc(f.texto)}</strong><div class="muted" style="font-size:.75rem">${ctx(f.contexto)[2]}</div></div><button class="btn btn-ghost btn-sm" data-act="use-favorite" data-key="${esc(cardKey(f))}" aria-label="Abrir carta favorita">Abrir</button></div>`).join(''):'<div class="empty"><div class="empty-emoji">⭐</div><p>Favorite cartas para voltar a elas quando quiser.</p></div>'}<div class="line-divider"></div><h3>Práticas recentes</h3>${recent.length?recent.map(x=>`<div class="fav-row"><span>💬</span><div style="flex:1"><strong style="font-size:.82rem">${esc(x.title)}</strong><div class="muted" style="font-size:.74rem">${fmtDate(x.data)} · +${x.xp} XP</div></div></div>`).join(''):'<p style="font-size:.83rem">Suas práticas com cartas aparecerão aqui.</p>'}</section></div>`}
function sequencia(){const days=Array.from({length:14},(_,i)=>addDays(i-13));return `${head('CONSTÂNCIA SEM PRESSA','Sua sequência','A sequência celebra os dias em que você aparece para praticar — não precisa fazer tudo de uma vez.')}<div class="grid cols-2"><section class="card" style="text-align:center">${mascot(S.streak>=7?'orgulhoso':S.streak>=3?'feliz':'incentivando',115)}<div class="eyebrow">Sequência atual</div><div class="display" style="font-size:3.4rem;color:var(--rose)">${S.streak} 🔥</div><p>dia${S.streak===1?'':'s'} consecutivo${S.streak===1?'':'s'}</p></section><section class="card" style="text-align:center"><div class="eyebrow">Seu recorde pessoal</div><div class="display" style="font-size:3.4rem;color:var(--yellow);margin:25px 0 6px">${S.best} 🏆</div><p>O seu melhor ritmo até agora.</p><div class="quote">Voltar depois de uma pausa também é progresso.</div></section></div><div class="section-title"><h2>Últimos 14 dias</h2><small>Marque presença do seu jeito</small></div><section class="card"><div class="streak-strip" style="grid-template-columns:repeat(7,minmax(0,1fr))">${days.map(d=>`<div class="streak-day ${S.days.includes(d)?'done':''} ${d===todayStr()?'today':''}">${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}<strong>${S.days.includes(d)?'✓':new Date(d+'T12:00:00').getDate()}</strong><small>${fmtDate(d,{day:'2-digit',month:'2-digit'})}</small></div>`).join('')}</div><p style="font-size:.81rem;margin:14px 0 0">Os dias são registrados ao concluir uma prática ou participar de um evento.</p></section><div class="section-title"><h2>Marcos de sequência</h2></div><section class="card">${MILESTONES.map(([n,xp])=>`<div class="milestone"><div class="milestone-icon">${S.best>=n?'🏅':'🎁'}</div><div class="milestone-body"><strong>${n} dias ${S.best>=n?'<span class="chip green">Conquistado</span>':''}</strong><small>Bônus de +${xp} XP ao alcançar ${n} dias de sequência.</small><div class="progress" style="margin-top:7px"><span style="width:${Math.min(100,S.streak/n*100)}%"></span></div></div>${S.best>=n?'<span style="color:var(--green)">✓</span>':''}</div>`).join('')}</section>`}
function diario(){return `${head('AUTOCONHECIMENTO','Diário de sentimentos','Um espaço só seu para perceber emoções, reconhecer aprendizados e registrar pequenos avanços.')}<div class="grid cols-2"><section class="card"><div class="card-head"><h2>Como você está agora?</h2>${mascot('neutro',50)}</div><form id="diaryForm"><div class="field"><label>Escolha um sentimento</label><div class="sent-grid" id="diarySentiments">${SENTIMENTOS.map(s=>`<button type="button" class="sent-btn ${selectedMood===s[0]?'active':''}" data-act="diary-mood" data-mood="${s[0]}"><span>${s[1]}</span>${s[2]}</button>`).join('')}</div></div><div class="field" style="margin-top:16px"><label for="diaryWhat">O que aconteceu?</label><textarea class="input" id="diaryWhat" rows="3" placeholder="Conte só o que se sentir confortável em registrar…"></textarea></div><div class="field" style="margin-top:13px"><label for="diaryFeel">Como esse momento afetou você?</label><textarea class="input" id="diaryFeel" rows="2" placeholder="O que você percebeu no corpo, nos pensamentos ou nas emoções?"></textarea></div><div class="field" style="margin-top:13px"><label for="diaryNext">O que gostaria de tentar da próxima vez?</label><textarea class="input" id="diaryNext" rows="2" placeholder="Uma ideia gentil para o futuro…"></textarea></div><button class="btn btn-primary btn-block" style="margin-top:16px" type="submit">📖 Salvar no diário</button></form><p style="font-size:.75rem;margin:12px 0 0">Suas entradas ficam neste navegador. Evite registrar senhas ou dados pessoais sensíveis.</p></section><section class="card"><div class="card-head"><h2>Suas reflexões</h2><span class="chip">${S.diary.length} entradas</span></div>${S.diary.length?S.diary.map((e,i)=>`<article class="entry"><div class="entry-head"><div><div class="evt-date">${fmtDate(e.data)} · ${SENTIMENTOS.find(s=>s[0]===e.sentimento)?.[1]||'💭'} ${SENTIMENTOS.find(s=>s[0]===e.sentimento)?.[2]||''}</div><strong>${esc(e.what||'Uma pausa para refletir')}</strong></div><button class="btn btn-ghost btn-sm" data-act="delete-diary" data-index="${i}" aria-label="Excluir entrada do diário">Excluir</button></div>${e.feel?`<p><strong>Como me senti:</strong> ${esc(e.feel)}</p>`:''}${e.next?`<p><strong>Próximo passo:</strong> ${esc(e.next)}</p>`:''}</article>`).join(''):`<div class="empty">${mascot('calmo',105)}<h3>Seu diário começa com uma pausa</h3><p>Registrar uma emoção, mesmo em poucas palavras, já é um gesto de autoconhecimento.</p></div>`}</section></div>`}

function evolucao(){const vals=HABILIDADES.map(h=>({...h,val:S.skills[h[0]]||0})),days=Array.from({length:7},(_,i)=>addDays(i-6)),xp=days.map(d=>S.xpByDay[d]||0),max=Math.max(20,...xp),sentiments=[...S.diary.map(x=>x.sentimento),...S.log.map(x=>x.sentimento)].filter(Boolean),counts=SENTIMENTOS.map(s=>({...s,count:sentiments.filter(x=>x===s[0]).length})).filter(s=>s.count).sort((a,b)=>b.count-a.count),contexts={};S.log.forEach(l=>contexts[l.contexto]=(contexts[l.contexto]||0)+1);return `${head('SEU CAMINHO','Minha evolução','Veja suas habilidades crescerem. Os percentuais são indicadores de prática, não uma nota sobre quem você é.')}<div class="grid cols-3">${statCard('⭐',S.xp,'XP total')}${statCard('🏅',levelOf(S.xp).n,levelOf(S.xp).name)}${statCard('✨',activityTotal(S),'atividades registradas')}</div><div class="grid cols-2" style="margin-top:17px"><section class="card"><div class="card-head"><h2>Habilidades</h2><span class="chip rose">0–100%</span></div>${vals.map(h=>`<div class="skill-row"><div class="skill-name">${h[1]} ${h[2]}</div><div class="progress ${h[3]}"><span style="width:${h.val}%"></span></div><div class="skill-num">${Math.round(h.val)}%</div></div>`).join('')}<p style="font-size:.78rem;margin:18px 0 0">As práticas somam pontos de habilidade até o limite de 100%.</p></section><section class="card"><div class="card-head"><h2>XP nos últimos 7 dias</h2></div><div class="mini-bars">${days.map((d,i)=>`<div class="bar-col"><small class="bar-value">${xp[i]||''}</small><div class="bar-track"><div class="bar-fill" style="height:${Math.max(xp[i]?5:0,xp[i]/max*100)}%"></div></div><span class="bar-day">${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</span></div>`).join('')}</div><div class="line-divider"></div><div class="grid cols-2">${statCard('🔥',S.streak,'sequência atual')}${statCard('🏆',S.best,'recorde pessoal')}</div></section></div><div class="grid cols-2" style="margin-top:17px"><section class="card"><div class="car const A11Y_OPTS=[['contrast','Alto contraste','Fundo preto, texto branco e destaques amarelos.'],['dyslexia','Fonte para dislexia','Fonte sem serifa e espaçamento confortável.'],['spacing','Espaçamento de texto','Mais espaço entre linhas e palavras.'],['links','Destacar links','Sublinhar links e realçar seus contornos.'],['motion','Reduzir animações','Desativar animações e transições.'],['focus','Foco reforçado','Contorno amarelo de alta visibilidade.'],['cursor','Cursor grande','Aumentar o cursor para facilitar a localização.'],['voice','Leitura em voz alta','Leia o conteúdo focado ou clicado (Web Speech).'],['vlibras','Tradutor de Libras (VLibras)','Carregar o widget oficial quando ativado.']];
function applyA11y(){const html=document.documentElement;A11Y_OPTS.forEach(([id])=>html.classList.toggle('a11y-'+id,!!a11y[id]&&id!=='voice'&&id!=='vlibras'));document.documentElement.style.fontSize=(15.5+a11y.scale*2)+'px';document.getElementById('a11yScaleLabel').textContent=a11y.scale===0?'Padrão':`${a11y.scale>0?'+':''}${a11y.scale*2}px`;document.querySelector('.a11y-fab').setAttribute('aria-expanded',String(!document.getElementById('a11yPanel').hidden));document.getElementById('a11yToggles').innerHTML=A11Y_OPTS.map(([id,n,d])=>`<div class="a11y-option"><div><strong>${n}</strong><small>${d}</small><small>${a11y[id]?'Ligado':'Desligado'}</small></div><button class="switch" data-act="a11y-switch" data-setting="${id}" aria-label="${n}" aria-pressed="${!!a11y[id]}"><span class="sr-only">${a11y[id]?'Ligado':'Desligado'}</span></button></div>`).join('');safeSet('speakup_a11y_v1',JSON.stringify(a11y));if(a11y.vlibras)enableVlibras();else disableVlibras();if(!a11y.voice&&window.speechSynthesis)try{speechSynthesis.cancel()}catch(e){}}
function loadA11y(){try{const d=JSON.parse(safeGet('speakup_a11y_v1')||'{}');a11y={...a11y,...d}}catch(e){}applyA11y()}
function a11yTogglePanel(){const p=document.getElementById('a11yPanel');p.hidden=!p.hidden;document.querySelector('.a11y-fab').setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden)p.querySelector('button')?.focus();else document.querySelector('.a11y-fab').focus()}
function enableVlibras(){if(document.getElementById('vlibrasWidget'))return;const wrap=document.createElement('div');wrap.id='vlibrasWidget';wrap.innerHTML='<div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>';document.body.appendChild(wrap);if(!document.getElementById('vlibras-script')){const sc=document.createElement('script');sc.id='vlibras-script';sc.src='https://vlibras.gov.br/app/vlibras-plugin.js';sc.onload=()=>{try{if(window.VLibras)new window.VLibras.Widget('https://vlibras.gov.br/app')}catch(e){}};document.body.appendChild(sc)}else try{if(window.VLibras)new window.VLibras.Widget('https://vlibras.gov.br/app')}catch(e){}}
function disableVlibras(){document.getElementById('vlibrasWidget')?.remove()}
document.addEventListener('click',e=>{
const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
switch(a){
case'route':go(b.dataset.route);break;
case'drawer-toggle':document.body.classList.toggle('drawer-open');b.setAttribute('aria-expanded',String(document.body.classList.contains('drawer-open')));break;
case'drawer-close':document.body.classList.remove('drawer-open');document.querySelector('[data-act="drawer-toggle"]').setAttribute('aria-expanded','false');break;
case'teacher-login':teacherLogin();break;
case'welcome-demo':closeModal();seedDemo();break;
case'teacher-logout':teacherLoggedIn=false;teacherStudent=null;go('inicio');toast('Sessão do professor encerrada','O acesso ficou oculto novamente.');break;
case'modal-close':closeModal();break;
case'modal-backdrop':if(e.target===b)closeModal();break;
case'start-activity':startActivity(b.dataset.type,b.dataset.id);break;
case'pick-feeling':selectedMood=b.dataset.mood;document.querySelectorAll('.feel-pick').forEach(x=>x.classList.toggle('active',x.dataset.mood===selectedMood));break;
case'confirm-activity':finishActivity();break;
case'set-challenge-tab':challengeTab=b.dataset.tab;challengeContext='todos';render();break;
case'context-filter':break;
case'set-mission-tab':missionTab=b.dataset.tab;render();break;
case'card-context':drawCard(b.dataset.context);go('cartas');break;
case'draw-card':drawCard(cardContext);render();break;
case'favorite-card':{const k=b.dataset.key;S.favorites=S.favorites.includes(k)?S.favorites.filter(x=>x!==k):[...S.favorites,k];save();checkAchievements();render();toast(S.favorites.includes(k)?'Carta favoritada':'Favorito removido','Sua biblioteca pessoal foi atualizada.');break}
case'use-favorite':{const card=LIB.card.find(x=>cardKey(x)===b.dataset.key);if(card){cardContext=card.contexto;currentCard=card;render()}break}
case'quick-mood':selectedMood=b.dataset.mood;document.querySelectorAll('[data-act="quick-mood"]').forEach(x=>x.classList.toggle('active',x.dataset.mood===selectedMood));touchDay();S.log.unshift({type:'mood',contexto:'cotidiano',sentimento:selectedMood,data:todayStr(),xp:0,title:'Check-in de humor'});S.log=S.log.slice(0,500);save();checkAchievements();document.getElementById('quickMoodMessage').innerHTML=`<div class="quote">${SENTIMENTOS.find(x=>x[0]===selectedMood)[1]} Tudo bem sentir ${selectedMood==='timido'?'timidez':selectedMood.toLowerCase()}. Obrigado por fazer essa pausa.</div>`;toast('Check-in registrado','Você reservou um momento para se perceber.');break;
case'diary-mood':selectedMood=b.dataset.mood;document.querySelectorAll('#diarySentiments .sent-btn').forEach(x=>x.classList.toggle('active',x.dataset.mood===selectedMood));break;
case'delete-diary':confirmAction('Excluir esta entrada?','Essa entrada será removida do diário deste navegador.',()=>{S.diary.splice(+b.dataset.index,1);save();render();toast('Entrada excluída','O diário foi atualizado.')});break;
case'join-event':joinEvent(b.dataset.id);break;
case'choose-avatar':S.avatar=b.dataset.avatar;save();render();break;
case'setting-toggle':{const id=b.dataset.setting;S.settings[id]=!S.settings[id];save();render();toast('Preferência atualizada',`${b.parentElement.querySelector('strong').textContent}: ${S.settings[id]?'ligado':'desligado'}.`);break}
case'seed-demo':confirmAction('Restaurar dados de demonstração?','Isso substituirá o progresso atual por um exemplo de uso. Essa ação não pode ser desfeita.',seedDemo);break;
case'reset-progress':confirmAction('Apagar todo o progresso?','Seu XP, sequência, diário, favoritos e histórico serão apagados deste navegador.',()=>{S=blankState();save();go('inicio');welcome(true);toast('Progresso apagado','Um novo começo está disponível.')});break;
case'a11y-toggle':a11yTogglePanel();break;
case'a11y-size':if(b.dataset.set!==undefined)a11y.scale=0;else a11y.scale=Math.max(-1,Math.min(4,a11y.scale+(+b.dataset.delta)));applyA11y();document.getElementById('a11yLive').textContent='Tamanho do texto atualizado.';break;
case'a11y-switch':{const id=b.dataset.setting;a11y[id]=!a11y[id];applyA11y();document.getElementById('a11yLive').textContent=`${A11Y_OPTS.find(x=>x[0]===id)[1]} ${a11y[id]?'ligado':'desligado'}.`;toast('Acessibilidade atualizada',`${A11Y_OPTS.find(x=>x[0]===id)[1]}: ${a11y[id]?'ligado':'desligado'}.`);break}
case'a11y-reset':a11y={scale:0,contrast:false,dyslexia:false,spacing:false,links:false,motion:false,focus:false,cursor:false,voice:false,vlibras:false};applyA11y();toast('Padrões restaurados','Preferências de acessibilidade redefinidas.');break;
case'teacher-form-tab':document.querySelectorAll('[data-act="teacher-form-tab"]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('teacherFormArea').innerHTML=teacherCreateForm(b.dataset.tab);break;
case'teacher-student':teacherStudent=b.dataset.id;render();break;
case'teacher-student-back':teacherStudent=null;render();break;
}
if(a11y.voice&&!b.closest('[data-act="a11y-switch"]'))speechSay(e.target.closest('button,a,article,.card')||b)
});
document.addEventListener('change',e=>{if(e.target.matches('[data-act="context-filter"]')){challengeContext=e.target.value;render()}});
document.addEventListener('submit',e=>{
const form=e.target;
if(form.id==='diaryForm'){e.preventDefault();const what=document.getElementById('diaryWhat').value.trim(),feel=document.getElementById('diaryFeel').value.trim(),next=document.getElementById('diaryNext').value.trim();if(!what&&!feel&&!next){toast('Conte um pouquinho','Escreva ao menos uma frase para salvar a reflexão.','error');return}S.diary.unshift({data:todayStr(),sentimento:selectedMood,what,feel,next});S.counters.diary++;touchDay();S.log.unshift({type:'diary',contexto:'profundas',sentimento:selectedMood,data:todayStr(),xp:0,title:'Entrada no diário'});checkAchievements();save();selectedMood='neutro';render();toast('Diário salvo','Obrigado por dedicar um momento a você.','success')}
else if(form.id==='profileForm'){e.preventDefault();const n=document.getElementById('profileName').value.trim();if(!n){toast('Nome necessário','Escolha um nome ou apelido.','error');return}S.name=n.slice(0,50);save();render();toast(`Perfil atualizado, ${firstName()}!`,'Suas informações foram salvas.','success')}
else if(form.id==='teacherLoginForm'){e.preventDefault();const email=document.getElementById('teacherEmail').value.trim(),pass=document.getElementById('teacherPassword').value,err=document.getElementById('teacherError');if(!email||!pass){err.textContent='Preencha o e-mail e a senha para continuar.';return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){err.textContent='Digite um e-mail válido.';return}teacherLoggedIn=true;closeModal();updateTop();toast('Acesso de demonstração liberado','Bem-vindo à Área do Professor.','success');go('professor')}
else if(form.id==='teacherCreateForm'){e.preventDefault();if(!teacherLoggedIn)return;const kind=form.dataset.kind,title=document.getElementById('tcTitle').value.trim(),desc=document.getElementById('tcDesc').value.trim();if(!title||!desc){toast('Preencha os campos','Título e descrição são obrigatórios.','error');return}if(kind==='event'){S.custom.event.push({id:'custom-event-'+Date.now(),emoji:'📅',titulo:title,descricao:desc,data:document.getElementById('tcDate').value,hora:document.getElementById('tcTime').value,local:document.getElementById('tcLocal').value.trim(),participantes:0,custom:true})}else S.custom[kind].push({id:'custom-'+kind+'-'+Date.now(),titulo:title,descricao:desc,texto:desc,contexto:document.getElementById('tcContext').value,dificuldade:+document.getElementById('tcDiff').value,habilidade:document.getElementById('tcSkill').value,custom:true});save();render();toast('Atividade criada','Ela já está disponível para o estudante neste navegador.','success')}
});
document.addEventListener('keydown',e=>{
if(e.key==='Tab'&&document.getElementById('modalRoot').innerHTML.trim()){const dlg=document.querySelector('#modalRoot [role="dialog"]');if(dlg){const fs=[...dlg.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')].filter(x=>x.offsetParent!==null);if(fs.length){const first=fs[0],last=fs[fs.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}}
if(e.key==='Escape'){if(!document.getElementById('modalRoot').innerHTML.trim()&&!document.getElementById('a11yPanel').hidden){document.getElementById('a11yPanel').hidden=true;document.querySelector('.a11y-fab').setAttribute('aria-expanded','false');document.querySelector('.a11y-fab').focus()}else if(document.getElementById('modalRoot').innerHTML.trim())closeModal();else if(document.body.classList.contains('drawer-open')){document.body.classList.remove('drawer-open');document.querySelector('[data-act="drawer-toggle"]').setAttribute('aria-expanded','false')}}
});
function speechSay(el){if(!a11y.voice||!('speechSynthesis'in window))return;const text=(el.innerText||el.value||el.getAttribute('aria-label')||'').trim();if(!text)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.slice(0,1600));u.lang='pt-BR';speechSynthesis.speak(u)}catch(e){}}
document.addEventListener('focusin',e=>{if(a11y.voice&&e.target.matches('button,a,h1,h2,h3,p,label,[role="button"]'))speechSay(e.target)});
function joinEvent(id){if(S.events[id])return;S.events[id]=true;S.counters.event++;const ev=getEvents().find(x=>x.id===id);touchDay();const xp=20;actLog('event',{contexto:'equipe',titulo:ev?.titulo||'Evento escolar'},'empolgado',xp);addXp(xp,'Evento');checkAchievements();save();render();toast('Participação registrada',`Você ganhou +${xp} XP por se inscrever.`,'success')}
function confirmAction(title,desc,fn){openModal(`<p>${esc(desc)}</p><div class="modal-actions"><button class="btn btn-ghost" data-act="modal-close">Cancelar</button><button class="btn btn-danger" id="confirmActionBtn" data-act="run-confirm">Confirmar</button></div>`,{title,eyebrow:'Confirmação'});document.getElementById('confirmActionBtn').onclick=()=>{closeModal();fn()}}
function seedDemo(){S=blankState();S.name='Alex';S.avatar='🦊';S.xp=785;S.streak=5;S.best=11;S.lastDay=todayStr();S.days=Array.from({length:11},(_,i)=>addDays(-10+i));S.days.splice(3,1);S.days.splice(7,1);S.xpByDay={};for(let i=0;i<7;i++)S.xpByDay[addDays(-i)]=[35,20,60,15,45,0,25][i];S.counters={challenge:12,mission:9,card:17,event:2,diary:6,hard:5};S.cardsUsed=17;S.skills={conv:44,inter:35,inic:28,conf:52,escu:47,expr:31};S.done.challenge={};dailyChallenges().slice(0,1).forEach(c=>S.done.challenge[itemId(c,'challenge')]=todayStr());S.diary=[{data:todayStr(),sentimento:'confiante',what:'Fiz uma pergunta em um grupo e a conversa continuou.',feel:'Fiquei nervoso no começo, depois mais tranquilo.',next:'Tentar escutar sem planejar a próxima resposta.'},{data:addDays(-1),sentimento:'timido',what:'Queria falar com uma pessoa nova.',feel:'Senti timidez, mas consegui cumprimentar.',next:'Fazer uma pergunta simples na próxima vez.'}];S.log=[];const feelKeys=['feliz','timido','confiante','tranquilo','empolgado','nervoso','pensativo'];for(let i=0;i<14;i++)S.log.push({type:i%3?'challenge':'card',contexto:CONTEXTOS[i%CONTEXTOS.length][0],sentimento:feelKeys[i%feelKeys.length],data:addDays(-(i%7)),xp:15+(i%4)*5,title:'Prática demonstrativa'});S.events={'seed-0':true,'seed-2':true};S.counters.event=2;S.achievements=[{id:0,date:addDays(-8)},{id:1,date:addDays(-7)},{id:2,date:addDays(-6)},{id:3,date:addDays(-4)},{id:10,date:addDays(-3)}];S.settings.onboarded=true;save();selectedMood='neutro';go('inicio');toast('Dados de demonstração restaurados','Você pode explorar as telas com este histórico de exemplo.','success')}
function welcome(force=false){if(!force&&S.settings.onboarded)return;openModal(`<div style="text-align:center">${mascot('incentivando',138)}<p>Este é um espaço para experimentar novas conversas sem pressão. Qual nome ou apelido você gostaria de usar?</p></div><form id="welcomeForm"><div class="field"><label for="w_name">Seu nome</label><input class="input" id="w_name" maxlength="50" required placeholder="Como podemos chamar você?" value="${esc(S.name)}"></div><div class="modal-actions" style="justify-content:space-between"><button class="btn btn-ghost" type="button" data-act="welcome-demo">Ver dados de demonstração</button><button class="btn btn-primary" type="submit">Vamos começar →</button></div></form>`,{title:'Boas-vindas ao Speak Up',eyebrow:'Seu espaço, seu ritmo'})}
document.addEventListener('submit',e=>{if(e.target.id==='welcomeForm'){e.preventDefault();const name=document.getElementById('w_name').value.trim();if(!name)return;S.name=name;S.settings.onboarded=true;save();closeModal();render();toast(`Bem-vindo, ${firstName()}!`,'Vamos dar o primeiro pequeno passo.','success')}});
function boot(){S=load();if(!safeGet('speakup.v1'))save();document.getElementById('brandMascot').innerHTML=mascot('sorrindo',47);loadA11y();routeNow=location.hash.slice(1);if(!VIEWS[routeNow]||routeNow==='professor')routeNow='inicio';render();if(!S.settings.onboarded)welcome();else if(S.settings.reminder&&S.lastDay&&S.lastDay!==todayStr()&&S.lastDay!==addDays(-1))toast('Sua sequência espera por você','Uma prática pequena já é suficiente.','info');if(!('speechSynthesis'in window))a11y.voice=false;checkAchievements()}
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(r&&r!==routeNow){if(r==='professor'&&!teacherLoggedIn){history.replaceState(null,'','#inicio');return}go(r)}});
boot();
</script>
</body>
