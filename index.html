/* ============================================================
   SPEAK UP — ACESSIBILIDADE
   Tema claro/escuro, alto contraste, tamanho de texto,
   redução de movimento e leitura em voz alta (Web Speech API).
   ============================================================ */

const FONT_PCT = {'0':100, '1':112, '2':125};
let fontLevel = 1; /* índice em FONT_PCT: 0=A-, 1=A, 2=A+ */
let ttsUtter = null;
let ttsKeepAlive = null;
let ttsUnlocked = false;

/* Safari/iOS só libera o áudio de síntese de voz depois do primeiro toque do usuário.
   Este "desbloqueio" silencioso resolve isso sem precisar de um clique extra. */
function unlockTts(){
  if(ttsUnlocked || !('speechSynthesis' in window)) return;
  ttsUnlocked = true;
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
document.addEventListener('click', unlockTts, {once:true, capture:true});
document.addEventListener('touchstart', unlockTts, {once:true, capture:true});

function clearKeepAlive(){
  if(ttsKeepAlive){ clearInterval(ttsKeepAlive); ttsKeepAlive = null }
}
function speakText(text){
  if(!('speechSynthesis' in window)){
    toast('Leitura não disponível', 'Este navegador não tem suporte a leitura em voz alta (Web Speech API).', '');
    return;
  }
  try{
    window.speechSynthesis.resume();
    window.speechSynthesis.cancel();
    clearKeepAlive();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-BR';
    u.rate = S.settings.ttsRate || 1;
    const voices = window.speechSynthesis.getVoices();
    const ptVoice = voices.find(v=> v.lang && v.lang.toLowerCase().startsWith('pt'));
    if(ptVoice) u.voice = ptVoice;
    ttsUtter = u;

    u.onstart = ()=>{
      document.querySelectorAll('.speak-btn.pending').forEach(b=>{b.classList.add('speaking');b.classList.remove('pending')});
      /* alguns navegadores (Chrome no Windows) interrompem a fala sozinhos após ~15s
         em textos longos; retomar periodicamente evita esse corte */
      clearKeepAlive();
      ttsKeepAlive = setInterval(()=>{
        if(!window.speechSynthesis.speaking){ clearKeepAlive(); return }
        window.speechSynthesis.pause();
        window.speechSynthesis.resume();
      }, 4000);
    };
    u.onend = ()=>{ clearKeepAlive(); document.querySelectorAll('.speak-btn').forEach(b=>b.classList.remove('speaking','pending')) };
    u.onerror = (ev)=>{
      clearKeepAlive();
      document.querySelectorAll('.speak-btn').forEach(b=>b.classList.remove('speaking','pending'));
      const motivo = (ev && ev.error) || 'desconhecido';
      if(motivo === 'not-allowed' || motivo === 'audio-busy'){
        toast('Toque novamente para ouvir', 'O navegador exige um toque para liberar o áudio.', '');
      } else if(motivo === 'language-unavailable' || motivo === 'voice-unavailable'){
        toast('Voz em português não encontrada', 'O dispositivo não tem uma voz em português instalada.', '');
      } else {
        toast('Não foi possível ler o texto', 'Motivo reportado pelo navegador: ' + motivo, '');
      }
    };
    window.speechSynthesis.speak(u);

    /* se depois de um instante o navegador não começou a falar nem avisou erro,
       o motivo mais comum é ausência de motor de voz no sistema */
    setTimeout(()=>{
      if(!window.speechSynthesis.speaking && !window.speechSynthesis.pending){
        const stillPending = document.querySelector('.speak-btn.pending');
        if(stillPending){
          stillPending.classList.remove('pending');
          toast('A leitura não iniciou', 'Verifique se o seu dispositivo tem uma voz instalada nas configurações de acessibilidade do sistema, ou tente novamente.', '');
        }
      }
    }, 1400);
  }catch(e){
    toast('Erro ao tentar ler o texto', e.message || '', '');
  }
}
function stopSpeak(){
  clearKeepAlive();
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b=>b.classList.remove('speaking','pending'));
}

function applyA11y(){
  const st = S.settings;
  document.documentElement.setAttribute('data-theme', st.theme === 'dark' ? 'dark' : 'light');
  document.documentElement.classList.toggle('contrast-high', !!st.highContrast);
  document.documentElement.classList.toggle('no-motion', !!st.reduceMotion);
  document.documentElement.style.fontSize = (FONT_PCT[fontLevel] || 100) + '%';

  const panel = document.getElementById('a11yPanel');
  if(panel){
    panel.querySelectorAll('[data-act="a11y-theme"]').forEach(b=> b.classList.toggle('active', b.dataset.v === st.theme));
    const swC = document.getElementById('a11ySwContrast'); if(swC) swC.classList.toggle('on', !!st.highContrast);
    const swM = document.getElementById('a11ySwMotion'); if(swM) swM.classList.toggle('on', !!st.reduceMotion);
    const rl = document.getElementById('a11yRateLabel'); if(rl) rl.textContent = (st.ttsRate||1).toFixed(1).replace('.0','') + 'x';
    const note = document.getElementById('a11yTtsNote');

    else fontLevel = Math.max(0, Math.min(2, fontLevel + parseInt(v,10)));
    S.settings.fontScale = fontLevel; save(); applyA11y();
  } else if(a === 'a11y-toggle'){
    const k = el.dataset.k;
    S.settings[k] = !S.settings[k]; save(); applyA11y();
  } else if(a === 'a11y-read'){
    readPage();
  } else if(a === 'a11y-stop'){
    stopSpeak();
  } else if(a === 'a11y-rate'){
    let r = (S.settings.ttsRate || 1) + (parseInt(el.dataset.v,10) * 0.25);
    r = Math.max(0.5, Math.min(2, r));
    S.settings.ttsRate = Math.round(r*100)/100; save(); applyA11y();
  } else if(a === 'speak'){
    if(el.classList.contains('speaking')){ stopSpeak() }
    else { el.classList.add('pending'); speakText(el.dataset.text) }
  }
});

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h }
function weekKey(d){ const dt=new Date((d||todayStr())+'T12:00:00'); const on=new Date(dt.getFullYear(),0,1); return dt.getFullYear()+'-w'+Math.ceil(((dt-on)/86400000 + on.getDay()+1)/7) }
function pickDaily(pool, seed, n){
  const out=[], used=new Set(), h=hash(seed);
  for(let i=0;i<n;i++){ let idx=(h + i*7919) % pool.length; while(used.has(idx)) idx=(idx+1)%pool.length; used.add(idx); out.push(pool[idx]) }
  return out;
}

/* ---------- SELEÇÃO INTELIGENTE DE CONTEÚDO ---------- */
function allChallenges(){ return S.custom.challenge.concat(CHALLENGES) }
function allMissions(){ return S.custom.mission.concat(MISSIONS) }
function dailyChallenge(){
  const custom = S.custom.challenge.filter(c=>!S.done.challenge[c.id]);
  if(custom.length) return custom[0];
  const unseen = CHALLENGES.filter(c=>!S.done.challenge[c.id]);
  const pool = unseen.length ? unseen : CHALLENGES;
  return pickDaily(pool, 'dc'+todayStr(), 1)[0];
}
function weeklyChallenges(){
  const unseen = CHALLENGES.filter(c=>!S.done.challenge[c.id] && c.dif>1);
  const pool = unseen.length>=4 ? unseen : CHALLENGES;
  return pickDaily(pool, 'wc'+weekKey(), 4);
}
function dailyMissions(){
  const unseen = MISSIONS.filter(m=>!S.done.mission[m.id]);
  const pool = unseen.length>=5 ? unseen : MISSIONS;
  const base = pickDaily(pool, 'dm'+todayStr(), 5);
  const custom = S.custom.mission.filter(m=>!S.done.mission[m.id]).slice(0,2);
  return custom.concat(base).slice(0,5);
}
function recommendedCard(){
  const unseen = CARDS.filter(c=>!S.cardSeen.includes(c.id));
  const pool = unseen.length ? unseen : CARDS;
  return pickDaily(pool, 'rc'+todayStr(), 1)[0];
}
function drawCard(ctxId){
  let pool = ctxId && ctxId!=='random' ? CARDS.filter(c=>c.ctx===ctxId) : CARDS;
  let unseen = pool.filter(c=>!S.cardSeen.includes(c.id) && (!UI.card || c.id!==UI.card.id));
  if(!unseen.length) unseen = pool.filter(c=>!UI.card || c.id!==UI.card.id);
  return unseen[Math.floor(Math.random()*unseen.length)];
}

   ============================================================ */
VIEWS.sequencia = function(){
  const t = todayStr();
  const days = []; for(let i=13;i>=0;i--) days.push(addDays(t,-i));
  const next = STREAK_REWARDS.find(r=>r.d > S.streak) || null;
  const prev = STREAK_REWARDS.filter(r=>r.d <= S.streak).pop();
  return `
  <div class="view-head"><h1>Sequência</h1><p>Aparecer todo dia é o que transforma coragem em hábito.</p></div>
  <div class="card" style="text-align:center">
    ${mascot(S.streak>=7?'determinado':S.streak>=3?'confiante':'timido',132,'bob')}
    <div style="font-family:var(--disp);font-size:3rem;font-weight:800;color:var(--orange);line-height:1">🔥 ${S.streak}</div>
    <div class="mid" style="font-weight:700">${S.streak<=1?'Comece sua sequência hoje!':'dias seguidos. Continue assim!'}</div>
    <div class="muted" style="margin-top:6px">Maior sequência: ${S.best} dias</div>
  </div>

  <div class="sec-title"><h2>Últimos 14 dias</h2></div>
  <div class="card">
    <div class="row" style="gap:8px">
      ${days.map(d=>{
        const on = S.days.includes(d);
        const dt = new Date(d+'T12:00:00');
        return `<div class="streak-day ${on?'on':''} ${d===t?'today':''}" title="${fmtDate(d)}">
          <span>${DAY_NAMES[dt.getDay()]}</span><span style="font-size:.95rem">${on?'🔥':dt.getDate()}</span></div>`;
      }).join('')}
    </div>
  </div>

  <div class="grid g2" style="margin-top:16px">
    <div class="card">
      <h3>Próxima recompensa</h3>
      ${next ? `<p class="mid" style="margin:10px 0">${next.name} — faltam <b>${next.d - S.streak} dias</b> para ganhar <b>+${next.xp} XP</b>.</p>
        ${bar((S.streak/next.d)*100,'yellow')}` : `<p class="mid" style="margin-top:10px">Você alcançou todas as recompensas de sequência. Respeito.</p>`}
      ${prev?`<div class="muted" style="margin-top:10px;font-size:.85rem">Última recompensa liberada: ${prev.name} (+${prev.xp} XP)</div>`:''}
    </div>
    <div class="card">
      <h3>Todas as recompensas</h3>
      <div style="margin-top:10px">
        ${STREAK_REWARDS.map(r=>`<div class="between" style="padding:7px 0;border-bottom:1px solid var(--line-soft)">
          <span>${S.best>=r.d?'✅':'🔒'} ${r.name}</span><span class="chip xp">+${r.xp} XP</span></div>`).join('')}
      </div>
    </div>
  </div>`;
};

/* ============================================================
   MINHA EVOLUÇÃO
   ============================================================ */
VIEWS.evolucao = function(){
  const t = todayStr();
  const last7 = []; for(let i=6;i>=0;i--){ const d = addDays(t,-i); last7.push({d, v:S.xpByDay[d]||0}) }
  const maxv = Math.max(10, ...last7.map(x=>x.v));
  const feelCounts = {};
  S.log.forEach(l=>{ if(l.feeling) feelCounts[l.feeling] = (feelCounts[l.feeling]||0)+1 });
  const totalFeel = Object.values(feelCounts).reduce((a,b)=>a+b,0);
  const ranked = Object.entries(feelCounts).sort((a,b)=>b[1]-a[1]);
  const ctxCount = {};
  S.log.forEach(l=>{ ctxCount[l.ctx] = (ctxCount[l.ctx]||0)+1 });
  const topCtx = Object.entries(ctxCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const recent = S.log.slice(-6).reverse();
  const positive = S.log.slice(-10).filter(l=>{ const f = FEEL_BY_ID[l.feeling]; return f && f.w>=2 }).length;

  return `
  <div class="view-head"><h1>Minha evolução</h1><p>Tudo que você registrou até aqui, em números e sentimentos.</p></div>

  <div class="grid g4">
    ${statCard('⭐','var(--yellow)',S.xp,'XP total')}
    ${statCard('🏅','var(--purple)','Nv '+levelOf(S.xp).n, levelOf(S.xp).name)}
    ${statCard('🔥','var(--orange)',S.streak,'sequência atual')}
    ${statCard('🎯','var(--green)',S.counters.challenge,'desafios')}
    ${statCard('🚀','var(--blue)',S.counters.mission,'missões')}
    ${statCard('💬','var(--rose)',S.counters.card,'cartas praticadas')}
    ${statCard('📅','var(--orange)',S.counters.event,'eventos')}
    ${statCard('📖','var(--purple)',S.counters.diary,'entradas no diário')}
  </div>

  <div class="grid g2" style="margin-top:18px">
    <div class="card">
      <h3>Suas habilidades</h3>
      <div style="margin-top:14px">
        ${SKILLS.map(s=>`<div class="skill-row"><div class="between"><span>${s.ico} ${s.name}</span><span class="muted">${S.skills[s.id]}%</span></div>${bar(S.skills[s.id], s.id==='escu'?'yellow':s.id==='conf'?'green':'blue')}</div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h3>XP dos últimos 7 dias</h3>
      <div class="mini-bars" style="margin-top:18px">
        ${last7.map(x=>`<div class="b" style="height:${Math.max(4,(x.v/maxv)*100)}%" title="${x.v} XP"><small>${DAY_NAMES[new Date(x.d+'T12:00:00').getDay()]}</small></div>`).join('')}
      </div>
      <div class="muted" style="margin-top:28px;font-size:.85rem">Total na semana: ${last7.reduce((a,b)=>a+b.v,0)} XP</div>
    </div>
  </div>

  <div class="card" style="margin-top:18px">
    <div class="row" style="align-items:flex-start">
      ${mascot(totalFeel? FEEL_BY_ID[ranked[0][0]].mood : 'curioso', 92)}
      <div style="flex:1;min-width:220px">
        <h3>Como você tem se sentido?</h3>
        ${totalFeel < 3
          ? `<p class="muted" style="margin-top:8px">Continue realizando atividades para descobrir seu padrão emocional.</p>`
          : `<p class="mid" style="margin:8px 0 14px">Seu sentimento mais frequente é <b>${FEEL_BY_ID[ranked[0][0]].label}</b>.
             ${positive>=5?'Nas últimas atividades você tem se sentido mais confiante — isso é evolução real.':'Sentir desconforto faz parte: você está praticando justamente o que é difícil.'}</p>
             ${ranked.slice(0,6).map(([id,n])=>{
               const f = FEEL_BY_ID[id], pct = Math.round((n/totalFeel)*100);
               return `<div class="fdist"><span class="lab">${mascot(f.mood,26)} ${f.label}</span>${bar(pct)}<span class="pct">${pct}%</span></div>`;
             }).join('')}`}
      </div>
    </div>
  </div>

  <div class="grid g2" style="margin-top:18px">
    <div class="card">
      <h3>Contextos que você mais praticou</h3>
      ${topCtx.length ? topCtx.map(([id,n])=>{
        const c = ctxOf(id);
        return `<div class="fdist" style="margin-top:10px"><span class="lab">${c.ico} ${c.name}</span>${bar((n/topCtx[0][1])*100,'green')}<span class="pct">${n}</span></div>`;
      }).join('') : `<p class="muted" style="margin-top:10px">Nada registrado ainda.</p>`}
    </div>
    <div class="card">
      <h3>Atividades recentes</h3>
      ${recent.length ? recent.map(l=>`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line-soft)">
          <div style="min-width:0"><b style="font-size:.92rem">${esc(l.title||'Atividade')}</b>
          <div class="muted" style="font-size:.78rem">${fmtDate(l.date)} · ${ctxOf(l.ctx).name} · ${FEEL_BY_ID[l.feeling]?FEEL_BY_ID[l.feeling].label:'—'}</div></div>
          <span class="chip xp">+${l.xp}</span></div>`).join('')
        : `<p class="muted" style="margin-top:10px">Conclua uma atividade para começar seu histórico.</p>`}
    </div>
  </div>`;
};

const STUDENT_NAMES = ['Ana Beatriz Lima','Bruno Carvalho','Camila Souza','Diego Ferreira','Eduarda Nunes','Felipe Ramos','Gabriela Torres','Henrique Alves','Isabela Rocha','João Pedro Matos','Karina Dias','Lucas Andrade','Mariana Prado','Nicolas Vieira','Olívia Martins','Pedro Henrique Sá','Queila Barbosa','Rafael Monteiro','Sofia Cardoso','Thiago Pinto','Úrsula Campos','Vinícius Leal','Yasmin Correia','Zeca Almeida'];
function fakeStudents(){
  return STUDENT_NAMES.map((name,i)=>{
    const h = hash(name);
    const xp = 80 + (h % 2400);
    const streak = h % 23;
    const st = {};
    SKILLS.forEach((s,k)=> st[s.id] = 15 + ((h>>(k+1)) % 80));
    const feels = {};
    FEELINGS.forEach((f,k)=>{ const v = (h>>(k%7)) % 9; if(v>2) feels[f.id] = v });
    return {
      id:'s'+i, name, avatar:AVATARS[h % AVATARS.length], xp, streak,
      best: streak + (h%9), level: levelOf(xp),
      challenges: 2 + (h % 46), missions: 3 + ((h>>2) % 70), cards: 5 + ((h>>3) % 90),
      events: h % 6, diary: h % 14, hard: h % 18,
      active: (h % 10) > 2, skills:st, feels
    };
  });
}
let STUDENTS = null;
function me(){
  const st = {};
  SKILLS.forEach(s=> st[s.id] = S.skills[s.id]);
  const feels = {};
  S.log.forEach(l=>{ if(l.feeling) feels[l.feeling]=(feels[l.feeling]||0)+1 });
  return {id:'me', name:(S.name||'Você')+' (você)', avatar:S.avatar, xp:S.xp, streak:S.streak, best:S.best,
    level:levelOf(S.xp), challenges:S.counters.challenge, missions:S.counters.mission, cards:S.counters.card,
    events:S.counters.event, diary:S.counters.diary, hard:S.counters.hard, active:true, skills:st, feels};
}

      </div>

  <div class="table-wrap">

/* ============================================================
   FLUXO DE ATIVIDADE: resultado → sentimento → feedback
   ============================================================ */
let PENDING = null;
function findItem(type, id){
  if(type==='card') return CARDS.find(c=>c.id===id);
  if(type==='challenge') return allChallenges().find(c=>c.id===id);
  if(type==='mission') return allMissions().find(c=>c.id===id);
  return null;
}
function startActivity(type, id, result, ev){
  const item = findItem(type, id);
  if(!item) return;
  if(type!=='card' && S.done[type][item.id]){ toast('Você já concluiu essa atividade', 'Escolha outra para ganhar XP.', ''); return }
  PENDING = {type, item, result: result || 'ok', ev:{clientX:ev&&ev.clientX, clientY:ev&&ev.clientY}};
  askFeeling();
}
function askFeeling(){
  const it = PENDING.item;
  openModal(`
    <div style="text-align:center">
      ${mascot('curioso',110,'pop')}
      <h2 style="margin-top:6px">Como você se sentiu?</h2>
      <p class="muted" style="margin:6px auto 0;max-width:40ch">${esc(it.title)}</p>
    </div>
    <div class="mood-row" style="margin-top:18px;justify-content:center">
      ${FEELINGS.map(f=>`<button class="mood-btn" data-act="feel" data-f="${f.id}">${mascot(f.mood,50)}<span>${f.label}</span></button>`).join('')}
    </div>
    <button class="btn ghost wide" style="margin-top:16px" onclick="closeModal()">Agora não</button>
  `, true);
}
function applyCompletion(feelId){
  const {type, item, result, ev} = PENDING;
  const feel = FEEL_BY_ID[feelId];
  const newDay = touchDay();
  let xp = xpFor(type, item.dif);
  if(result==='hard') xp += Math.round(xp*0.25); /* tentar quando é difícil vale mais */

  if(type==='card'){ S.counters.card++; if(!S.cardSeen.includes(item.id)) S.cardSeen.push(item.id) }
  else { S.done[type][item.id] = todayStr(); S.counters[type]++ }
  if(item.dif===3) S.counters.hard++;
  addSkill(item.skill, item.dif);
  S.log.push({date:todayStr(), type, item:item.id, title:item.title, ctx:item.ctx, dif:item.dif, feeling:feelId, result, xp});

  addXp(xp, activityLabel(type), ev);
  if(newDay){
    setTimeout(()=>{
      addXp(baseXp('streak'), '🔥 Sequência mantida!');
      const rw = STREAK_REWARDS.find(r=>r.d===S.streak);
      if(rw) setTimeout(()=> addXp(rw.xp, `Recompensa: ${rw.name}`), 500);
    }, 400);
  }
  checkAchievements();
  save();
  feedbackModal(feel, result, item, xp);
  if(type==='card'){ UI.card = drawCard(UI.ctx) }
  PENDING = null;
  render();
}
function activityLabel(t){ return {card:'Carta praticada', challenge:'Desafio concluído', mission:'Missão concluída'}[t] }
function feedbackModal(feel, result, item, xp){
  let mood, title, msg;
  if(item.dif===3 && result!=='skip'){
    mood='comemorando'; title='Atividade de maior dificuldade concluída';
    msg='Esse tipo de prática costuma trazer o maior ganho de confiança. Fica registrado no seu histórico.';
  } else if(feel.w <= 0){
    mood = feel.mood; title='Registro concluído';
    msg = result==='hard' ? 'Sentir desconforto é esperado ao praticar algo novo. O registro foi salvo.'
      : 'A prática constante, mesmo com desconforto, é o que gera evolução ao longo do tempo.';
  } else if(feel.w >= 3){
    mood='muito_feliz'; title='Bom resultado';
    msg='Atividade concluída com uma sensação positiva. Vale repetir esse tipo de situação nos próximos dias.';
  } else {
    mood='feliz'; title='Atividade registrada';
    msg='Constância importa mais do que intensidade. A prática regular constrói o hábito.';
  }
  if(S.settings.sound) confetti();
  openModal(`
    <div style="text-align:center">
      ${mascot(mood,140,'pop')}
      <h2 style="margin-top:8px">${title}</h2>
      <div class="chip xp" style="margin-top:8px">+${xp} XP</div>
      <p class="mid" style="margin:12px auto 0;max-width:42ch">${msg}</p>
      <div class="muted" style="margin-top:12px;font-size:.84rem">Registrado: ${esc(item.title)} · ${ctxOf(item.ctx).name} · ${DIFFS[item.dif].name} · ${feel.label}</div>
      <button class="btn primary wide" style="margin-top:18px" onclick="closeModal()">Continuar</button>
    </div>`);
}

/* ============================================================
   AÇÕES (delegação de eventos)
   ============================================================ */
document.addEventListener('click', function(e){
  const nav = e.target.closest('[data-nav]');
  if(nav){ go(nav.dataset.nav); return }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const a = el.dataset.act;

  switch(a){
    case 'go': go(el.dataset.v); break;
    case 'tab': UI.tab[el.dataset.k] = el.dataset.v; render(); break;
    case 'filterch': UI.tab.desafiosCtx = el.dataset.c; render(); break;

    case 'do': startActivity(el.dataset.type, el.dataset.id, el.dataset.result, e); break;

    case 'pickctx':
      UI.ctx = el.dataset.c; UI.card = drawCard(UI.ctx);
      countDraw(e); render(); break;
    case 'backctx': UI.ctx = null; UI.card = null; render(); break;
    case 'newcard':
      UI.card = drawCard(UI.ctx); countDraw(e); render(); break;
    case 'skipcard':
      if(!S.cardSeen.includes(el.dataset.id)) S.cardSeen.push(el.dataset.id);
      UI.card = drawCard(UI.ctx); save();
      toast('Tudo bem, essa não era a sua', 'Trouxe outra situação para você.', '');
      render(); break;
    case 'fav': {
      const id = el.dataset.id, i = S.favorites.indexOf(id);
      if(i>=0){ S.favorites.splice(i,1); toast('Removida das favoritas','','') }
      else { S.favorites.push(id); toast('❤️ Carta favoritada','Você encontra ela na tela de cartas.','win'); checkAchievements() }
      save(); render(); break;
    }

    case 'feel': closeModal(); applyCompletion(el.dataset.f); break;
    case 'quickfeel': {
      const f = FEEL_BY_ID[el.dataset.f];
      S.log.push({date:todayStr(), type:'humor', item:'-', title:'Registro de humor', ctx:'cotidiano', dif:1, feeling:f.id, result:'ok', xp:0});
      touchDay(); save();
      openModal(`<div style="text-align:center">${mascot(f.mood,130,'pop')}
        <h2 style="margin-top:8px">Registrado: ${f.label}</h2>
        <p class="mid" style="margin:10px auto 0;max-width:40ch">${f.w>=2?'Aproveite o momento para realizar o desafio de hoje.':'Registro salvo. Um desafio de dificuldade fácil pode ser um bom próximo passo.'}</p>
        <button class="btn primary wide" style="margin-top:16px" onclick="closeModal();go('desafios')">Ver desafio de hoje</button>
        <button class="btn ghost wide" style="margin-top:8px" onclick="closeModal()">Fechar</button></div>`);
      render(); break;
    }
    case 'diarymood': UI.diaryMood = el.dataset.f; render(); break;

    case 'savediary': {
      const get = id => ($('#'+id)||{}).value || '';
      const entry = {date:todayStr(), mood:UI.diaryMood||'neutro', dia:get('d_dia').trim(), situacao:get('d_situacao').trim(),
        dificil:get('d_dificil').trim(), consegui:get('d_consegui').trim(), orgulho:get('d_orgulho').trim(), melhorar:get('d_melhorar').trim()};
      if(!entry.dia && !entry.situacao){ toast('Escreva pelo menos uma linha','Comece por "como foi meu dia".',''); break }
      S.diary.push(entry); S.counters.diary++;
      S.log.push({date:todayStr(), type:'diary', item:'d', title:'Entrada no diário', ctx:'cotidiano', dif:1, feeling:entry.mood, result:'ok', xp:baseXp('diary')});
      touchDay(); addXp(baseXp('diary'), '📖 Entrada salva!', e);
      checkAchievements(); save(); UI.diaryMood = null; render();
      toast('Entrada salva','Você pode reler quando quiser.','win'); break;
    }
    case 'deldiary': {
      S.diary = S.diary.filter(x=>x.date!==el.dataset.d);
      S.counters.diary = Math.max(0, S.counters.diary-1); save(); render(); break;
    }

    case 'join': {
      const ev = allEvents().find(x=>x.id===el.dataset.id);
      if(!ev || S.events[ev.id]) break;
      S.events[ev.id] = true; S.counters.event++;
      S.log.push({date:todayStr(), type:'event', item:ev.id, title:ev.title, ctx:'festas', dif:2, feeling:'empolgado', result:'ok', xp:baseXp('event')});
      touchDay(); addXp(baseXp('event'), '📅 Participação confirmada!', e);
      addSkill('inter', 2); checkAchievements(); save(); render();
      openModal(`<div style="text-align:center">${mascot('empolgado',130,'pop')}
        <h2 style="margin-top:8px">Presença confirmada</h2>
        <p class="mid" style="margin:10px auto 0;max-width:40ch">${esc(ev.title)} · ${fmtDate(ev.date)} às ${esc(ev.time)}, no ${esc(ev.place)}.</p>
        <button class="btn primary wide" style="margin-top:16px" onclick="closeModal()">Fechar</button></div>`);
      break;
    }

    case 'avatar': S.avatar = el.dataset.a; save(); syncTop(); render(); toast('Avatar atualizado','','win'); break;
    case 'saveprofile': {
      const n = ($('#p_name')||{}).value;
      if(n && n.trim()) S.name = n.trim();
      save(); render(); toast('Perfil salvo','','win'); break;
    }
    case 'savesettings': {
      const n = ($('#c_name')||{}).value, av = ($('#c_avatar')||{}).value;
      if(n && n.trim()) S.name = n.trim();
      if(av) S.avatar = av;
      save(); syncTop(); render(); toast('Configurações salvas','','win'); break;
    }
    case 'toggle': S.settings[el.dataset.k] = !S.settings[el.dataset.k]; save(); render(); break;
    case 'restore':
      openModal(`<div style="text-align:center">${mascot('pensativo',120)}
        <h2 style="margin-top:8px">Restaurar demonstração?</h2>
        <p class="mid" style="margin:10px auto;max-width:40ch">Isso substitui seu progresso atual por dados de exemplo, úteis para apresentar a plataforma.</p>
        <button class="btn primary wide" data-act="restore2">Sim, restaurar</button>
        <button class="btn ghost wide" style="margin-top:8px" onclick="closeModal()">Cancelar</button></div>`);
      break;
    case 'restore2': seedDemo(S.name||'Estudante'); closeModal(); go('inicio'); toast('Dados de demonstração restaurados','','win'); break;
    case 'wipe':
      openModal(`<div style="text-align:center">${mascot('triste',120)}
        <h2 style="margin-top:8px">Apagar todo o progresso?</h2>
        <p class="mid" style="margin:10px auto;max-width:40ch">XP, sequência, diário e conquistas serão perdidos. Não dá para desfazer.</p>
        <button class="btn primary wide" data-act="wipe2">Apagar tudo</button>
        <button class="btn ghost wide" style="margin-top:8px" onclick="closeModal()">Cancelar</button></div>`);
      break;
    case 'wipe2': {
      const nome = S.name; S = blankState(); S.name = nome; save(); closeModal(); go('inicio');
      toast('Progresso apagado','Começando do zero.',''); break;
    }

    case 'student': UI.student = el.dataset.id; render(); window.scrollTo({top:0}); break;
    case 'backstudents': UI.student = null; render(); break;

    case 'newchallenge': case 'newmission': {
      const p = a==='newchallenge' ? 'nc' : 'nm';
      const t = ($('#'+p+'_title')||{}).value, tx = ($('#'+p+'_text')||{}).value;
      if(!t || !t.trim()){ toast('Dê um título ao conteúdo','','' ); break }
      const kind = a==='newchallenge' ? 'challenge' : 'mission';
      const item = {id:(kind==='challenge'?'dx':'mx')+Date.now(), ctx:$('#'+p+'_ctx').value, dif:parseInt($('#'+p+'_dif').value,10),
        skill:$('#'+p+'_skill').value, title:t.trim(), text:(tx||'').trim()||'Atividade criada pelo professor.'};
      S.custom[kind].push(item); save(); render();
      toast(kind==='challenge'?'Desafio criado':'Missão criada','Já aparece para os alunos.','win'); break;
    }
    case 'newevent': {
      const t = ($('#ne_title')||{}).value;
      if(!t || !t.trim()){ toast('Dê um título ao evento','',''); break }
      S.custom.event.push({id:'ex'+Date.now(), ico:'🎪', title:t.trim(), date:$('#ne_date').value||addDays(todayStr(),7),
        time:$('#ne_time').value||'14h00', place:$('#ne_place').value||'Escola', people:0,
        desc:($('#ne_desc').value||'').trim()||'Evento criado pelo professor.'});
      save(); render(); toast('Evento criado','Disponível na aba Eventos.','win'); break;
    }
  }
});
function countDraw(ev){
  const d = todayStr();
  S.cardDraws[d] = (S.cardDraws[d]||0) + 1;
  if(S.cardDraws[d] <= 5){ touchDay(); addXp(baseXp('draw'), '💬 Carta utilizada', ev) }
  save();
}

/* ---------- MENU MOBILE ---------- */
document.getElementById('burger').addEventListener('click', ()=>{
  $('#sidebar').classList.add('open'); $('#scrim').classList.add('on');
});
document.getElementById('scrim').addEventListener('click', ()=>{
  $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on');
});
document.getElementById('tbAvatar').addEventListener('click', ()=> go('perfil'));

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
function boot(){
  buildNav();
  const had = load();
  fontLevelFromScale();
  applyA11y();
  if(!had){
    seedDemo('Estudante');
    render(); syncTop();
    openModal(`
      <div style="text-align:center">
        ${mascot('timido',150,'pop')}
        <h2 style="margin-top:10px">Olá, eu sou o Brainzy</h2>
        <p class="mid" style="margin:10px auto 0;max-width:42ch">Vou acompanhar sua prática de comunicação no Speak Up. Como posso te chamar?</p>
        <input class="input" id="w_name" placeholder="Seu nome" style="margin-top:16px;text-align:center">
        <button class="btn primary wide" style="margin-top:12px" data-act="welcome" onclick="welcome()">Vamos começar</button>
        <p class="muted" style="margin-top:12px;font-size:.8rem">A plataforma abre com dados de exemplo para você explorar. Dá para zerar tudo em Configurações.</p>
      </div>`);
  } else {
    const grew = touchDay();
    render(); syncTop();
    if(grew && S.streak>1) setTimeout(()=> toast(`Sequência de ${S.streak} dias`, 'Continue no ritmo.', 'win'), 700);
  }
  checkAchievements(true);
  save();
}
function welcome(){
  const v = ($('#w_name')||{}).value;
  if(v && v.trim()) S.name = v.trim();
  save(); closeModal(); render(); syncTop();
  toast(`Bem-vindo, ${firstName()}`, 'Comece pelo desafio de hoje.', 'win');
}
boot();

</script>
